<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Energy Orb & Laser — MediaPipe Tasks-Vision</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #040711;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e6f7ff;
    }
    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #0a152b 0%, #03050c 100%);
    }
    /* 거울 모드 적용된 캔버스 */
    canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      display: block;
    }
    video {
      display: none;
    }
    .hud {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(8, 20, 44, 0.72);
      border: 1px solid rgba(56, 189, 248, 0.35);
      backdrop-filter: blur(10px);
      font-size: 13px;
      letter-spacing: 0.02em;
      box-shadow: 0 0 20px rgba(14, 165, 233, 0.18);
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 10px #38bdf8;
    }
    .guide {
      max-width: 360px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(6, 15, 34, 0.65);
      border: 1px solid rgba(125, 211, 252, 0.2);
      backdrop-filter: blur(8px);
      font-size: 12.5px;
      line-height: 1.55;
      color: #bae6fd;
    }
    .guide strong {
      color: #ffffff;
    }
    #startBtn {
      position: fixed;
      z-index: 20;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 700;
      color: #e0f2fe;
      background: linear-gradient(135deg, rgba(2, 132, 199, 0.85), rgba(37, 99, 235, 0.85));
      border: 1px solid rgba(125, 211, 252, 0.6);
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 0 28px rgba(56, 189, 248, 0.45);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    #startBtn:hover {
      transform: scale(1.03);
      box-shadow: 0 0 38px rgba(56, 189, 248, 0.7);
    }
  </style>
</head>
<body>
  <div id="stage">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <div class="hud">
    <div class="badge">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">카메라 초기화 대기 중...</span>
    </div>
    <div class="guide">
      <div><strong>1. 보자기(손 펴기)</strong>로 손 인식 활성화</div>
      <div><strong>2. 주먹/오므리기</strong>로 손바닥에 파란 네온 구체 충전</div>
      <div><strong>3. 다시 보자기(손 펴기)</strong>로 전방 레이저 빔 발사</div>
    </div>
  </div>

  <button id="startBtn">전면 카메라 시작</button>

  <script type="module">
    import {
      FilesetResolver,
      HandLandmarker
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const video = document.getElementById("webcam");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const startBtn = document.getElementById("startBtn");
    const statusText = document.getElementById("statusText");
    const statusDot = document.getElementById("statusDot");

    const HAND_CONNECTIONS = [
      [0, 1], [1, 2], [2, 3], [3, 4],
      [0, 5], [5, 6], [6, 7], [7, 8],
      [5, 9], [9, 10], [10, 11], [11, 12],
      [9, 13], [13, 14], [14, 15], [15, 16],
      [13, 17], [17, 18], [18, 19], [19, 20],
      [0, 17]
    ];

    let handLandmarker = null;
    let lastVideoTime = -1;
    let running = false;

    // 손별 상태 머신 저장소 (최대 2손 지원)
    const handStates = [
      createHandState(),
      createHandState()
    ];

    // 파티클 및 화면 흔들림
    const particles = [];
    let shakeIntensity = 0;

    function createHandState() {
      return {
        seenOpenPalm: false,   // 먼저 손을 완전히 편 적이 있는지
        gesture: "UNKNOWN",    // "OPEN" | "CLOSED" | "MID"
        charge: 0,             // 0.0 ~ 1.0
        beamTimer: 0,          // 남은 레이저 발사 시간(초)
        beamMaxDuration: 0.65,
        palmX: 0,
        palmY: 0,
        dirX: 1,
        dirY: 0
      };
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function setStatus(msg, color = "#38bdf8") {
      statusText.textContent = msg;
      statusDot.style.background = color;
      statusDot.style.boxShadow = `0 0 10px ${color}`;
    }

    async function initHandLandmarker() {
      setStatus("MediaPipe 모델 로딩 중...", "#38bdf8");
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 2,
        minHandDetectionConfidence: 0.6,
        minHandPresenceConfidence: 0.6,
        minTrackingConfidence: 0.6
      });
    }

    async function startCamera() {
      startBtn.disabled = true;
      startBtn.textContent = "연결 중...";
      try {
        if (!handLandmarker) {
          await initHandLandmarker();
        }
        setStatus("전면 카메라 권한 요청 중...", "#38bdf8");
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user",
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });
        video.srcObject = stream;
        await new Promise((resolve) => {
          video.onloadedmetadata = () => resolve();
        });
        await video.play();
        startBtn.style.display = "none";
        running = true;
        setStatus("실시간 손 추적 활성 — 손을 펼쳐보세요", "#22d3ee");
        requestAnimationFrame(loop);
      } catch (err) {
        console.error(err);
        startBtn.disabled = false;
        startBtn.textContent = "전면 카메라 다시 시도";
        setStatus("카메라 접근 실패: HTTPS/로컬서버 및 권한 확인", "#f87171");
      }
    }

    startBtn.addEventListener("click", startCamera);

    // 손 펴짐/오므림 판별 (손목(0)에서 각 손가락 MCP, PIP, TIP까지의 거리 비율 활용)
    function classifyHandGesture(landmarks) {
      const wrist = landmarks[0];
      const middleMcp = landmarks[9];
      const palmScale = Math.hypot(middleMcp.x - wrist.x, middleMcp.y - wrist.y) || 0.001;

      const fingerIndices = [
        [2, 3, 4],     // 엄지
        [5, 6, 8],     // 검지
        [9, 10, 12],   // 중지
        [13, 14, 16],  // 약지
        [17, 18, 20]   // 소지
      ];

      let extendedCount = 0;
      let foldedCount = 0;

      for (const [mcpIdx, pipIdx, tipIdx] of fingerIndices) {
        const tipDist = Math.hypot(landmarks[tipIdx].x - wrist.x, landmarks[tipIdx].y - wrist.y) / palmScale;
        const pipDist = Math.hypot(landmarks[pipIdx].x - wrist.x, landmarks[pipIdx].y - wrist.y) / palmScale;

        if (tipDist > 1.45 && tipDist > pipDist * 1.08) {
          extendedCount++;
        } else if (tipDist < 1.15) {
          foldedCount++;
        }
      }

      if (extendedCount >= 4) return "OPEN";
      if (foldedCount >= 4) return "CLOSED";
      return "MID";
    }

    function spawnSparks(x, y, count, color = "#38bdf8", speedScale = 1) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = (1.5 + Math.random() * 6.5) * speedScale;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1.0,
          decay: 0.025 + Math.random() * 0.035,
          radius: 1.5 + Math.random() * 3.5,
          color
        });
      }
    }

    function drawHandSkeleton(landmarks) {
      ctx.save();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(56, 189, 248, 0.35)";
      for (const [a, b] of HAND_CONNECTIONS) {
        const pa = landmarks[a];
        const pb = landmarks[b];
        ctx.beginPath();
        ctx.moveTo(pa.x * canvas.width, pa.y * canvas.height);
        ctx.lineTo(pb.x * canvas.width, pb.y * canvas.height);
        ctx.stroke();
      }
      for (let i = 0; i < landmarks.length; i++) {
        const p = landmarks[i];
        ctx.beginPath();
        ctx.arc(p.x * canvas.width, p.y * canvas.height, i === 9 ? 4.5 : 2.5, 0, Math.PI * 2);
        ctx.fillStyle = i === 9 ? "#7dd3fc" : "#38bdf8";
        ctx.fill();
      }
      ctx.restore();
    }

    function drawEnergyOrb(x, y, charge, timeSec) {
      if (charge <= 0.01) return;

      const baseRadius = 14 + charge * 42;
      const pulse = Math.sin(timeSec * 16) * (3 + charge * 6);
      const r = Math.max(8, baseRadius + pulse);

      ctx.save();
      ctx.globalCompositeOperation = "lighter";

      // 외부 네온 아우라
      const outerGrad = ctx.createRadialGradient(x, y, r * 0.1, x, y, r * 2.4);
      outerGrad.addColorStop(0, `rgba(224, 242, 254, ${0.95 * charge})`);
      outerGrad.addColorStop(0.25, `rgba(56, 189, 248, ${0.85 * charge})`);
      outerGrad.addColorStop(0.65, `rgba(37, 99, 235, ${0.38 * charge})`);
      outerGrad.addColorStop(1, "rgba(14, 165, 233, 0)");

      ctx.fillStyle = outerGrad;
      ctx.beginPath();
      ctx.arc(x, y, r * 2.4, 0, Math.PI * 2);
      ctx.fill();

      // 고에너지 코어
      const coreGrad = ctx.createRadialGradient(x, y, 1, x, y, r * 0.75);
      coreGrad.addColorStop(0, "#ffffff");
      coreGrad.addColorStop(0.45, "#7dd3fc");
      coreGrad.addColorStop(1, "#0284c7");

      ctx.fillStyle = coreGrad;
      ctx.beginPath();
      ctx.arc(x, y, r * 0.72, 0, Math.PI * 2);
      ctx.fill();

      // 회전하는 전기 링
      ctx.strokeStyle = `rgba(186, 230, 253, ${0.85 * charge})`;
      ctx.lineWidth = 2 + charge * 2.5;
      ctx.beginPath();
      ctx.arc(x, y, r * 1.15, timeSec * 5, timeSec * 5 + Math.PI * 1.35);
      ctx.stroke();

      ctx.restore();
    }

    function drawLaserBeam(state, timeSec) {
      if (state.beamTimer <= 0) return;

      const progress = state.beamTimer / state.beamMaxDuration; // 1.0 -> 0.0
      const intensity = Math.sin(progress * Math.PI); // 부드러운 피크 후 소멸
      const startX = state.palmX;
      const startY = state.palmY;

      // 캔버스 경계까지 연장된 끝점 계산
      const diag = Math.hypot(canvas.width, canvas.height) * 1.5;
      const endX = startX + state.dirX * diag;
      const endY = startY + state.dirY * diag;

      const beamWidth = (34 + state.charge * 36) * (0.45 + 0.75 * intensity);

      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.lineCap = "round";

      // 1단: 넓은 네온 글로우
      ctx.strokeStyle = `rgba(37, 99, 235, ${0.42 * intensity})`;
      ctx.lineWidth = beamWidth * 2.6;
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(endX, endY);
      ctx.stroke();

      // 2단: 시안 에너지 빔
      ctx.strokeStyle = `rgba(56, 189, 248, ${0.85 * intensity})`;
      ctx.lineWidth = beamWidth * 1.25;
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(endX, endY);
      ctx.stroke();

      // 3단: 백색 초고열 중심 코어
      ctx.strokeStyle = `rgba(255, 255, 255, ${0.98 * intensity})`;
      ctx.lineWidth = beamWidth * 0.45;
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(endX, endY);
      ctx.stroke();

      // 빔 내부 진동 파형
      const perpX = -state.dirY;
      const perpY = state.dirX;
      ctx.strokeStyle = `rgba(186, 230, 253, ${0.75 * intensity})`;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      const segments = 28;
      for (let i = 0; i <= segments; i++) {
        const t = i / segments;
        const px = startX + (endX - startX) * t;
        const py = startY + (endY - startY) * t;
        const wave = Math.sin(t * 24 - timeSec * 45) * (beamWidth * 0.35) * intensity;
        const wx = px + perpX * wave;
        const wy = py + perpY * wave;
        if (i === 0) ctx.moveTo(wx, wy);
        else ctx.lineTo(wx, wy);
      }
      ctx.stroke();

      // 발사원 머즐 플래시 구체
      const flashR = beamWidth * (0.85 + 0.25 * Math.sin(timeSec * 50));
      const flashGrad = ctx.createRadialGradient(startX, startY, 2, startX, startY, flashR * 1.8);
      flashGrad.addColorStop(0, "#ffffff");
      flashGrad.addColorStop(0.35, "#7dd3fc");
      flashGrad.addColorStop(0.75, "rgba(2, 132, 199, 0.6)");
      flashGrad.addColorStop(1, "rgba(2, 132, 199, 0)");
      ctx.fillStyle = flashGrad;
      ctx.beginPath();
      ctx.arc(startX, startY, flashR * 1.8, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function updateAndDrawParticles() {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.96;
        p.vy *= 0.96;
        p.life -= p.decay;

        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius * p.life, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    let prevTimestamp = performance.now();

    function loop(now) {
      if (!running) return;
      const dt = Math.min(0.05, (now - prevTimestamp) / 1000);
      prevTimestamp = now;
      const timeSec = now / 1000;

      // 카메라 프레임 감지
      if (video.currentTime !== lastVideoTime && video.readyState >= 2) {
        lastVideoTime = video.currentTime;
        const results = handLandmarker.detectForVideo(video, now);

        // 배경 비디오 그리기
        ctx.save();
        if (shakeIntensity > 0.2) {
          const sx = (Math.random() - 0.5) * shakeIntensity;
          const sy = (Math.random() - 0.5) * shakeIntensity;
          ctx.translate(sx, sy);
        }
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        // 어두운 사이버 네온 틴트
        ctx.fillStyle = "rgba(4, 10, 24, 0.38)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const detectedHands = results.landmarks || [];

        if (detectedHands.length === 0) {
          for (const st of handStates) {
            st.charge = Math.max(0, st.charge - dt * 0.8);
          }
          setStatus("손을 화면에 보여주세요 (보자기 → 오므리기 → 보자기)", "#38bdf8");
        }

        for (let i = 0; i < Math.min(detectedHands.length, handStates.length); i++) {
          const lm = detectedHands[i];
          const st = handStates[i];

          // 손바닥 중심(손목 0과 중지 뿌리 9의 중간) 및 발사 방향(손목 0 -> 중지 뿌리 9)
          const wristX = lm[0].x * canvas.width;
          const wristY = lm[0].y * canvas.height;
          const midX = lm[9].x * canvas.width;
          const midY = lm[9].y * canvas.height;

          st.palmX = (wristX + midX) * 0.5;
          st.palmY = (wristY + midY) * 0.5;

          const vx = midX - wristX;
          const vy = midY - wristY;
          const len = Math.hypot(vx, vy) || 1;
          st.dirX = vx / len;
          st.dirY = vy / len;

          const gesture = classifyHandGesture(lm);
          st.gesture = gesture;

          if (gesture === "OPEN") {
            // 이전에 오므려서 구체를 충전한 상태였다면 레이저 빔 발사!
            if (st.seenOpenPalm && st.charge > 0.15) {
              st.beamTimer = st.beamMaxDuration;
              shakeIntensity = Math.max(shakeIntensity, 14 + st.charge * 14);
              spawnSparks(st.palmX, st.palmY, 34, "#7dd3fc", 1.5);
              setStatus("레이저 빔 발사!", "#22d3ee");
            }
            st.seenOpenPalm = true;
            st.charge = Math.max(0, st.charge - dt * 2.5);
          } else if (gesture === "CLOSED") {
            if (st.seenOpenPalm) {
              st.charge = Math.min(1.0, st.charge + dt * 1.15);
              if (Math.random() < 0.55) {
                spawnSparks(st.palmX, st.palmY, 2
