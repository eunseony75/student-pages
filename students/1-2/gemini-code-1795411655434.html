<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>실시간 얼굴 인식 인사말 웹앱</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --success: #22c55e;
      --warning: #f59e0b;
      --neutral: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 65%);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      width: 100%;
      max-width: 980px;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 20px;
    }

    @media (max-width: 820px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: rgba(30, 41, 59, 0.88);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(8px);
    }

    .header {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 18px 22px;
    }

    .header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--card-border);
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--warning);
    }

    .dot.ready {
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .webcam-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 12px;
      overflow: hidden;
      background: #020617;
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #webcam-container canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
      display: block;
    }

    .overlay-badge {
      position: absolute;
      left: 12px;
      bottom: 12px;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(148, 163, 184, 0.35);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
    }

    .controls {
      margin-top: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      background: rgba(15, 23, 42, 0.55);
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.18);
    }

    .control-item label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .control-item label strong {
      color: var(--text);
    }

    .control-item input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .right-col {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .greeting-box {
      min-height: 170px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
      border-left: 5px solid var(--neutral);
      transition: border-color 0.25s ease, background-color 0.25s ease;
    }

    .greeting-box.state-me {
      border-left-color: var(--success);
      background: rgba(34, 197, 94, 0.08);
    }

    .greeting-box.state-friend {
      border-left-color: var(--accent);
      background: rgba(56, 189, 248, 0.08);
    }

    .greeting-box.state-bg {
      border-left-color: var(--neutral);
      background: rgba(100, 116, 139, 0.08);
    }

    .state-tag {
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    .greeting-text {
      font-size: 1.45rem;
      font-weight: 700;
      line-height: 1.4;
      word-break: keep-all;
    }

    .sub-info {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .section-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .prob-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .prob-item {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .prob-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
    }

    .prob-label {
      font-weight: 600;
    }

    .prob-value {
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }

    .bar-track {
      width: 100%;
      height: 12px;
      background: rgba(15, 23, 42, 0.85);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.16);
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      transition: width 0.12s ease-out;
    }

    .bar-fill.active-me {
      background: linear-gradient(90deg, #16a34a, #4ade80);
    }

    .bar-fill.active-friend {
      background: linear-gradient(90deg, #2563eb, #38bdf8);
    }

    .bar-fill.active-bg {
      background: linear-gradient(90deg, #475569, #94a3b8);
    }

    .voice-btn {
      margin-top: 14px;
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: rgba(15, 23, 42, 0.75);
      color: var(--text);
      font-size: 0.85rem;
      cursor: pointer;
    }

    .voice-btn:hover {
      border-color: var(--accent);
    }

    .error-msg {
      color: #f87171;
      font-size: 0.9rem;
      margin-top: 10px;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card header">
      <h1>실시간 얼굴 인식 인사말</h1>
      <div class="status-pill">
        <span id="status-dot" class="dot"></span>
        <span id="status-text">모델 및 웹캠 초기화 중...</span>
      </div>
    </div>

    <div class="card">
      <div class="webcam-wrap">
        <div id="webcam-container"></div>
        <div id="live-candidate" class="overlay-badge">감지 중: -</div>
      </div>

      <div class="controls">
        <div class="control-item">
          <label for="threshold-slider">
            <span>확신도 기준</span>
            <strong id="threshold-val">75%</strong>
          </label>
          <input id="threshold-slider" type="range" min="50" max="95" step="1" value="75" />
        </div>
        <div class="control-item">
          <label for="streak-slider">
            <span>연속 프레임 수</span>
            <strong id="streak-val">6프레임</strong>
          </label>
          <input id="streak-slider" type="range" min="2" max="15" step="1" value="6" />
        </div>
      </div>

      <button id="test-voice-btn" class="voice-btn" type="button">
        브라우저 음성 안내 테스트(자동 재생이 막힐 경우 클릭해 권한 활성화)
      </button>
      <div id="error-box" class="error-msg"></div>
    </div>

    <div class="right-col">
      <div id="greeting-card" class="card greeting-box state-bg">
        <div id="state-tag" class="state-tag">현재 확정 상태: [배경]</div>
        <div id="greeting-text" class="greeting-text">사람이 감지되지 않았습니다.</div>
        <div id="speech-log" class="sub-info">마지막 음성 출력: 없음</div>
      </div>

      <div class="card">
        <div class="section-title">
          <span>레이블별 인식 확률</span>
          <span id="fps-text" class="sub-info">0 FPS</span>
        </div>
        <div id="prob-list" class="prob-list"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
