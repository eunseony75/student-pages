<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediaPipe 실시간 손 인식 노란 전기 충전 &amp; 전방 발사</title>
  <style>
    :root {
      --bg: #050814;
      --panel: rgba(15, 23, 42, 0.82);
      --border: rgba(250, 204, 21, 0.42);
      --text: #f8fafc;
      --neon-yellow: #facc15;
      --neon-gold: #fde047;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      gap: 14px;
    }

    .hud {
      width: 100%;
      max-width: 960px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      backdrop-filter: blur(8px);
    }

    .hud-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--neon-gold);
    }

    .hud-steps {
      font-size: 0.88rem;
      color: var(--text);
    }

    .status-pill {
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(250, 204, 21, 0.16);
      border: 1px solid rgba(250, 204, 21, 0.48);
      color: var(--neon-gold);
      font-size: 0.85rem;
      font-weight: 700;
    }

    .stage-wrap {
      position: relative;
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(250, 204, 21, 0.16);
    }

    video {
      display: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .error-banner {
      max-width: 960px;
      width: 100%;
      color: #fca5a5;
      font-size: 0.88rem;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>
      <div class="hud-title">HAND YELLOW ELECTRIC CHARGE &amp; BOLT CANNON</div>
      <div class="hud-steps">
        1) 손 펼치기 → 2) 손 오므리기(손바닥 노란 전기 충전) → 3) 다시 펴기(전방 굵은 노란 전기 발사)
      </div>
    </div>
    <div id="phaseBadge" class="status-pill">카메라 및 모델 로딩 중...</div>
  </div>

  <div class="stage-wrap">
    <video id="webcam" playsinline autoplay muted></video>
    <canvas id="fxCanvas"></canvas>
  </div>

  <div id="errorBox" class="error-banner"></div>

  <script type="module">
    import {
      HandLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

    const video = document.getElementById("webcam");
    const canvas = document.getElementById("fxCanvas");
    const ctx = canvas.getContext("2d");
    const phaseBadge = document.getElementById("phaseBadge");
    const errorBox = document.getElementById("errorBox");

    let sequenceState = "IDLE";
    let chargeLevel = 0;
    let boltTimer = 0;
    let boltOrigin = { x: 0, y: 0 };
    let boltDir = { x: 0, y: -1 };
    let handDetected = false;
    let lastPalmPos = { x: 0, y: 0 };
    let lastAimDir = { x: 0, y: -1 };

    let openFrames = 0;
    let closedFrames = 0;
    const REQUIRED_FRAMES = 4;

    const sparks = [];

    function spawnSparks(x, y, count, color, speedMin, speedMax) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = speedMin + Math.random() * (speedMax - speedMin);
        sparks.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: 1.6 + Math.random() * 3.2,
          alpha: 1,
          decay: 1.8 + Math.random() * 2.2,
          color
        });
      }
    }

    function dist(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function classifyHandPose(landmarks) {
      const wrist = landmarks[0];
      const middleMcp = landmarks[9];
      const palmScale = Math.max(0.05, dist(wrist, middleMcp));

      const fingerTips = [8, 12, 16, 20];
      const fingerPips = [6, 10, 14, 18];

      let extendedCount = 0;
      let curledCount = 0;

      for (let i = 0; i < fingerTips.length; i++) {
        const tipDist = dist(landmarks[fingerTips[i]], wrist) / palmScale;
        const pipDist = dist(landmarks[fingerPips[i]], wrist) / palmScale;
        if (tipDist > pipDist * 1.12 && tipDist > 1.35) {
          extendedCount++;
        } else if (tipDist < pipDist * 0.98 || tipDist < 1.15) {
          curledCount++;
        }
      }

      const thumbTipDist = dist(landmarks[4], landmarks[17]) / palmScale;
      const thumbIpDist = dist(landmarks[3], landmarks[17]) / palmScale;
      if (thumbTipDist > thumbIpDist * 1.08 && thumbTipDist > 1.15) {
        extendedCount++;
      }

      if (extendedCount >= 4) return "OPEN";
      if (curledCount >= 3 && extendedCount <= 1) return "CLOSED";
      return "NEUTRAL";
    }

    function updateSequence(pose, palmCanvasPos, aimDir) {
      lastPalmPos = palmCanvasPos;
      lastAimDir = aimDir;

      if (pose === "OPEN") {
        openFrames++;
        closedFrames = 0;
      } else if (pose === "CLOSED") {
        closedFrames++;
        openFrames = 0;
      } else {
        openFrames = Math.max(0, openFrames - 1);
        closedFrames = Math.max(0, closedFrames - 1);
      }

      if (sequenceState === "IDLE") {
        if (openFrames >= REQUIRED_FRAMES) {
          sequenceState = "READY_OPEN";
          chargeLevel = 0;
        }
      } else if (sequenceState === "READY_OPEN") {
        if (closedFrames >= REQUIRED_FRAMES) {
          sequenceState = "CHARGING";
          chargeLevel = Math.max(chargeLevel, 0.15);
        }
      } else if (sequenceState === "CHARGING") {
        if (pose === "CLOSED") {
          chargeLevel = Math.min(1, chargeLevel + 0.035);
          if (Math.random() < 0.75) {
            const angle = Math.random() * Math.PI * 2;
            const r = 40 + Math.random() * 42;
            sparks.push({
              x: palmCanvasPos.x + Math.cos(angle) * r,
              y: palmCanvasPos.y + Math.sin(angle) * r,
              vx: -Math.cos(angle) * 180,
              vy: -Math.sin(angle) * 180,
              radius: 1.8 + Math.random() * 2.5,
              alpha: 1,
              decay: 2.6,
              color: Math.random() < 0.5 ? "#facc15" : "#fef08a"
            });
          }
        } else if (openFrames >= REQUIRED_FRAMES) {
          if (chargeLevel >= 0.2) {
            boltTimer = 0.65 + chargeLevel * 0.45;
            boltOrigin = { ...palmCanvasPos };
            boltDir = { ...aimDir };
            spawnSparks(palmCanvasPos.x, palmCanvasPos.y, 44, "#fde047", 120, 480);
          }
          sequenceState = "READY_OPEN";
          chargeLevel = 0;
        }
      }
    }

    function buildLightningPoints(x1, y1, x2, y2, segments, jitterAmp) {
      const pts = [{ x: x1, y: y1 }];
      const dx = x2 - x1;
      const dy = y2 - y1;
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len;
      const ny = dx / len;

      for (let i = 1; i < segments; i++) {
        const t = i / segments;
        const envelope = Math.sin(t * Math.PI);
        const offset = (Math.random() * 2 - 1) * jitterAmp * envelope;
        pts.push({
          x: x1 + dx * t + nx * offset,
          y: y1 + dy * t + ny * offset
        });
      }
      pts.push({ x: x2, y: y2 });
      return pts;
    }

    function strokeLightningPath(pts, outerColor, coreColor, outerWidth, coreWidth) {
      if (pts.length < 2) return;

      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) {
        ctx.lineTo(pts[i].x, pts[i].y);
      }

      ctx.strokeStyle = outerColor;
      ctx.lineWidth = outerWidth;
      ctx.stroke();

      ctx.strokeStyle = coreColor;
      ctx.lineWidth = coreWidth;
      ctx.stroke();
    }

    function drawPalmElectricity(x, y, level, timeSec) {
      if (level <= 0.01) return;

      const pulse = 1 + Math.sin(timeSec * 22) * 0.1;
      const radius = (18 + level * 42) * pulse;

      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      const glow = ctx.createRadialGradient(x, y, radius * 0.1, x, y, radius * 2.1);
      glow.addColorStop(0, "rgba(255, 253, 224, 0.96)");
      glow.addColorStop(0.3, "rgba(250, 204, 21, 0.85)");
      glow.addColorStop(0.7, "rgba(234, 179, 8, 0.28)");
      glow.addColorStop(1, "rgba(202, 138, 4, 0)");

      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(x, y, radius * 2.1, 0, Math.PI * 2);
      ctx.fill();

      const arcCount = 4 + Math.floor(level * 6);
      for (let i = 0; i < arcCount; i++) {
        const a1 = (Math.PI * 2 * i) / arcCount + timeSec * 4;
        const a2 = a1 + 0.85 + Math.random() * 0.5;
        const r1 = radius * (0.65 + Math.random() * 0.55);
        const r2 = radius * (0.65 + Math.random() * 0.55);

        const p1 = { x: x + Math.cos(a1) * r1, y: y + Math.sin(a1) * r1 };
        const p2 = { x: x + Math.cos(a2) * r2, y: y + Math.sin(a2) * r2 };
        const mid = {
          x: (p1.x + p2.x) * 0.5 + (Math.random() - 0.5) * 26 * level,
          y: (p1.y + p2.y) * 0.5 + (Math.random() - 0.5) * 26 * level
        };

        const pts = [p1, mid, p2];
        strokeLightningPath(
          pts,
          "rgba(250, 204, 21, 0.88)",
          "#fef9c3",
          3 + level * 3,
          1.2 + level * 1.2
        );
      }

      ctx.restore();
    }

    function drawForwardElectricityBolt(origin, dir, intensity, timeSec) {
      if (intensity <= 0) return;

      const beamLen = Math.hypot(canvas.width, canvas.height) * 1.35;
      const endX = origin.x + dir.x * beamLen;
      const endY = origin.y + dir.y * beamLen;
      const normX = -dir.y;
      const normY = dir.x;

      const alphaScale = Math.min(1, intensity * 1.35);
      const mainWidth = (28 + intensity * 36) * alphaScale;

      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      const mainPts = buildLightningPoints(
        origin.x,
        origin.y,
        endX,
        endY,
        22,
        24 + intensity * 26
      );
      strokeLightningPath(
        mainPts,
        `rgba(234, 179, 8, ${0.45 * alphaScale})`,
        `rgba(250, 204, 21, ${0.92 * alphaScale})`,
        mainWidth * 2.1,
        mainWidth
      );
      strokeLightningPath(
        mainPts,
        `rgba(254, 240, 138, ${0.95 * alphaScale})`,
        `rgba(255, 255, 255, ${alphaScale})`,
        mainWidth * 0.55,
        mainWidth * 0.25
      );

      for (const side of [-1, 1]) {
        const spread = side * (16 + intensity * 22);
        const subPts = buildLightningPoints(
          origin.x,
          origin.y,
          endX + normX * spread * 2.5,
          endY + normY * spread * 2.5,
          18,
          28 + intensity * 24
        );
        strokeLightningPath(
          subPts,
          `rgba(253, 224, 71, ${0.68 * alphaScale})`,
          `rgba(254, 249, 195, ${0.92 * alphaScale})`,
          mainWidth * 0.55,
          mainWidth * 0.2
        );
      }

      for (let i = 3; i < mainPts.length - 2; i += 3) {
        const anchor = mainPts[i];
        const branchSide = (i % 6 === 0 ? 1 : -1) + (Math.random() - 0.5) * 0.7;
        const branchLen = 65 + Math.random() * 110 * intensity;
        const bx = anchor.x + (dir.x * 0.65 + normX * branchSide) * branchLen;
        const by = anchor.y + (dir.y * 0.65 + normY * branchSide) * branchLen;
        const branchPts = buildLightningPoints(anchor.x, anchor.y, bx, by, 6, 14);
        strokeLightningPath(
          branchPts,
          `rgba(250, 204, 21, ${0.72 * alphaScale})`,
          `rgba(255, 253, 224, ${0.92 * alphaScale})`,
          6 * alphaScale,
          2 * alphaScale
        );
      }

      const flashR = (38 + intensity * 45) * (1 + Math.sin(timeSec * 50) * 0.12);
      const flashGrad = ctx.createRadialGradient(origin.x, origin.y, 4, origin.x, origin.y, flashR);
      flashGrad.addColorStop(0, `rgba(255, 255, 255, ${alphaScale})`);
      flashGrad.addColorStop(0.4, `rgba(250, 204, 21, ${0.88 * alphaScale})`);
      flashGrad.addColorStop(1, "rgba(234, 179, 8, 0)");

      ctx.fillStyle = flashGrad;
      ctx.beginPath();
      ctx.arc(origin.x, origin.y, flashR, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function updateAndDrawSparks(dt) {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.x += s.vx * dt;
        s.y += s.vy * dt;
        s.alpha -= s.decay * dt;

        if (s.alpha <= 0) {
          sparks.splice(i, 1);
          continue;
        }

        ctx.globalAlpha = Math.max(0, s.alpha);
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function updateBadgeText() {
      if (boltTimer > 0) {
        phaseBadge.textContent = "전방 굵은 노란 전기 발사!";
      } else if (sequenceState === "CHARGING") {
        phaseBadge.textContent = `손바닥 노란 전기 충전 중 (${Math.round(chargeLevel * 100)}%) — 펴서 발사!`;
      } else if (sequenceState === "READY_OPEN") {
        phaseBadge.textContent = "손 펼침 확인 — 손을 오므려 전기를 충전하세요";
      } else if (handDetected) {
        phaseBadge.textContent = "손 인식 중 — 손을 활짝 펴주세요";
      } else {
        phaseBadge.textContent = "전면 카메라에서 손을 보여주세요";
      }
    }

    function syncCanvasSize() {
      const rect = canvas.getBoundingClientRect();
      const targetW = Math.max(640, Math.round(rect.width));
      const targetH = Math.max(360, Math.round(rect.height));
      if (canvas.width !== targetW || canvas.height !== targetH) {
        canvas.width = targetW;
        canvas.height = targetH;
      }
    }

    async function init() {
      try {
        syncCanvasSize();

        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );

        const handLandmarker = await HandLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numHands: 1
        });

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user",
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        let lastTime = performance.now();
        let lastVideoTime = -1;

        function renderLoop(now) {
          syncCanvasSize();
          const dt = Math.min(0.05, (now - lastTime) / 1000);
          lastTime = now;
          const timeSec = now / 1000;

          ctx.save();
          ctx.translate(canvas.width, 0);
          ctx.scale(-1, 1);
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          ctx.restore();

          ctx.fillStyle = "rgba(4, 10, 26, 0.28)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
            lastVideoTime = video.currentTime;
            const results = handLandmarker.detectForVideo(video, now);

            if (results.landmarks && results.landmarks.length > 0) {
              handDetected = true;
              const lm = results.landmarks[0];

              const toCanvas = (pt) => ({
                x: (1 - pt.x) * canvas.width,
                y: pt.y * canvas.height
              });

              const wristPt = toCanvas(lm[0]);
              const middleMcpPt = toCanvas(lm[9]);
              const middleTipPt = toCanvas(lm[12]);

              const palmCenter = {
                x: (wristPt.x + middleMcpPt.x) * 0.5,
                y: (wristPt.y + middleMcpPt.y) * 0.5
              };

              const dx = middleTipPt.x - wristPt.x;
              const dy = middleTipPt.y - wristPt.y;
              const mag = Math.hypot(dx, dy) || 1;
              const aimDir = { x: dx / mag, y: dy / mag };

              const pose = classifyHandPose(lm);
              updateSequence(pose, palmCenter, aimDir);
            } else {
              handDetected = false;
              openFrames = 0;
              closedFrames = 0;
              if (sequenceState === "CHARGING") {
                chargeLevel = Math.max(0, chargeLevel - dt * 0.6);
                if (chargeLevel <= 0) {
                  sequenceState = "IDLE";
                }
              }
            }
          }

          if (boltTimer > 0) {
            boltTimer = Math.max(0, boltTimer - dt);
            const intensity = Math.min(1, boltTimer / 0.45);
            drawForwardElectricityBolt(boltOrigin, boltDir, intensity, timeSec);
          }

          if (sequenceState === "CHARGING" && chargeLevel > 0) {
            drawPalmElectricity(lastPalmPos.x, lastPalmPos.y, chargeLevel, timeSec);
          }

          updateAndDrawSparks(dt);
          updateBadgeText();

          requestAnimationFrame(renderLoop);
        }

        requestAnimationFrame(renderLoop);
      } catch (err) {
        console.error(err);
        phaseBadge.textContent = "초기화 오류";
        errorBox.textContent =
          "전면 카메라 또는 MediaPipe HandLandmarker 초기화에 실패했습니다. HTTPS 환경 및 카메라 권한을 확인해 주세요.\n" +
          (err && err.message ? err.message : String(err));
      }
    }

    init();
  </script>
</body>
</html>
