<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>티쳐블머신 실시간 인식 & 음성 안내</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 920px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .header h1 {
      font-size: 1.35rem;
      font-weight: 700;
    }

    .badge {
      font-size: 0.85rem;
      padding: 6px 12px;
      border-radius: 999px;
      background: #334155;
      color: #e2e8f0;
    }

    .badge.active {
      background: #065f46;
      color: #a7f3d0;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .webcam-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    #webcam-container {
      width: 100%;
      max-width: 360px;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      overflow: hidden;
      background: #0b1120;
      border: 2px solid #475569;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #webcam-container canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
      display: block;
    }

    .message-card {
      width: 100%;
      max-width: 360px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 16px;
      min-height: 92px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
    }

    .message-label {
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .message-text {
      font-size: 1.15rem;
      font-weight: 700;
      color: #38bdf8;
      line-height: 1.45;
      word-break: keep-all;
    }

    .panel {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 20px;
    }

    .panel-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .panel-sub {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 18px;
    }

    .bars {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .bar-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .bar-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .bar-track {
      width: 100%;
      height: 18px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid #334155;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #3b82f6, #22d3ee);
      transition: width 0.12s ease-out;
    }

    .bar-fill.confirmed {
      background: linear-gradient(90deg, #10b981, #34d399);
    }

    .meta {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #1e293b;
      font-size: 0.82rem;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .notice {
      margin-top: 12px;
      font-size: 0.8rem;
      color: #fbbf24;
      min-height: 1.1em;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>실시간 인식 & 한국어 음성 안내</h1>
      <div id="status-badge" class="badge">모델 및 웹캠 시작 중...</div>
    </div>

    <div class="grid">
      <div class="webcam-box">
        <div id="webcam-container">카메라 연결 대기 중...</div>
        <div class="message-card">
          <div class="message-label" id="state-sub">현재 확정 상태: 대기 중</div>
          <div class="message-text" id="greeting-display">인식을 기다리는 중입니다.</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">레이블별 실시간 인식 확률</div>
        <div class="panel-sub">확신도 75% 이상이 7프레임 연속 감지되면 상태를 확정합니다.</div>
        <div id="label-bars" class="bars"></div>
        <div class="meta">
          <span id="candidate-info">후보: - (0/7)</span>
          <span id="last-spoken">마지막 음성: 없음</span>
        </div>
        <div id="audio-notice" class="notice"></div>
      </div>
    </div>
  </div>

  <!-- TensorFlow.js & Teachable Machine Image Library -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

  <script>
    const MODEL_URL = "https://teachablemachine.withgoogle.com/models/sCzbJTjS8/";

    // 프레임 흔들림 방지 설정
    const CONFIDENCE_THRESHOLD = 0.75; // 일정 확신도 이상
    const REQUIRED_CONSECUTIVE_FRAMES = 7; // 연속 감지 프레임 수

    function normalizeLabel(rawName) {
      return rawName.replace(/^\[|\]$/g, "").trim();
    }

    // 레이블별 화면 표시 문구 및 음성 안내 문구
    const LABEL_ACTIONS = {
      "나": {
        displayText: "어서오세요",
        speakText: "어서오세요",
        isGreeting: true
      },
      "친구": {
        displayText: "안녕하세요? 용건을 말해주세요",
        speakText: "안녕하세요? 용건을 말해주세요",
        isGreeting: true
      },
      "배경": {
        displayText: "사람이 없는 상태입니다.",
        speakText: null,
        isGreeting: false
      }
    };

    let model;
    let webcam;
    const barElements = new Map();

    // 상태 추적 변수
    let confirmedState = null;       // 현재 확정된 상태
    let candidateState = null;       // 연속 카운트 중인 후보 상태
    let consecutiveCount = 0;      // 후보 상태 연속 프레임 수
    let lastSpokenState = null;      // 마지막으로 음성 출력한 상태

    const badgeEl = document.getElementById("status-badge");
    const webcamContainerEl = document.getElementById("webcam-container");
    const barsContainerEl = document.getElementById("label-bars");
    const stateSubEl = document.getElementById("state-sub");
    const greetingDisplayEl = document.getElementById("greeting-display");
    const candidateInfoEl = document.getElementById("candidate-info");
    const lastSpokenEl = document.getElementById("last-spoken");
    const audioNoticeEl = document.getElementById("audio-notice");

    function getKoreanVoice() {
      if (!("speechSynthesis" in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      return (
        voices.find((v) => v.lang && v.lang.toLowerCase().startsWith("ko")) ||
        null
      );
    }

    function speakKorean(text) {
      if (!text) return;
      if (!("speechSynthesis" in window)) {
        audioNoticeEl.textContent = "이 브라우저는 음성 합성(Web Speech API)을 지원하지 않습니다.";
        return;
      }

      try {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "ko-KR";
        utterance.rate = 1.0;
        utterance.pitch = 1.0;

        const koVoice = getKoreanVoice();
        if (koVoice) {
          utterance.voice = koVoice;
        }

        utterance.onerror = (event) => {
          if (event.error === "not-allowed") {
            audioNoticeEl.textContent = "브라우저 자동재생 정책으로 음성이 차단되었습니다. 화면을 한 번 클릭해 주세요.";
          }
        };

        utterance.onstart = () => {
          audioNoticeEl.textContent = "";
        };

        window.speechSynthesis.speak(utterance);
      } catch (err) {
        console.error("Speech error:", err);
      }
    }

    function buildBars(classLabels) {
      barsContainerEl.innerHTML = "";
      barElements.clear();

      classLabels.forEach((rawLabel) => {
        const cleanLabel = normalizeLabel(rawLabel);

        const item = document.createElement("div");
        item.className = "bar-item";

        const header = document.createElement("div");
        header.className = "bar-header";

        const nameSpan = document.createElement("span");
        nameSpan.textContent = `[${cleanLabel}]`;

        const pctSpan = document.createElement("span");
        pctSpan.textContent = "0.0%";

        header.appendChild(nameSpan);
        header.appendChild(pctSpan);

        const track = document.createElement("div");
        track.className = "bar-track";

        const fill = document.createElement("div");
        fill.className = "bar-fill";

        track.appendChild(fill);
        item.appendChild(header);
        item.appendChild(track);
        barsContainerEl.appendChild(item);

        barElements.set(cleanLabel, { pctSpan, fill });
      });
    }

    function updateBars(predictions, activeConfirmedState) {
      predictions.forEach((pred) => {
        const cleanLabel = normalizeLabel(pred.className);
        const prob = Number.isFinite(pred.probability) ? pred.probability : 0;
        const pct = (prob * 100).toFixed(1);

        const ui = barElements.get(cleanLabel);
        if (ui) {
          ui.pctSpan.textContent = `${pct}%`;
          ui.fill.style.width = `${Math.min(100, Math.max(0, prob * 100))}%`;
          if (cleanLabel === activeConfirmedState) {
            ui.fill.classList.add("confirmed");
          } else {
            ui.fill.classList.remove("confirmed");
          }
        }
      });
    }

    function applyConfirmedState(newState) {
      const prevConfirmed = confirmedState;
      confirmedState = newState;

      const action = LABEL_ACTIONS[newState] || {
        displayText: `인식된 상태: [${newState}]`,
        speakText: null,
        isGreeting: false
      };

      stateSubEl.textContent =
        newState === "배경"
          ? "현재 확정 상태: [배경] (사람 없음)"
          : `현재 확정 상태: [${newState}]`;

      greetingDisplayEl.textContent = action.displayText;

      // 이전 확정 상태와 다른 상태로 바뀔 때만 1회 발화 ([배경]은 인사말 없음)
      if (newState !== prevConfirmed) {
        if (newState === "배경") {
          lastSpokenState = "배경";
          lastSpokenEl.textContent = "마지막 음성: 없음 (배경)";
        } else if (action.speakText && newState !== lastSpokenState) {
          speakKorean(action.speakText);
          lastSpokenState = newState;
          lastSpokenEl.textContent = `마지막 음성: [${newState}]`;
        }
      }
    }

    function processStability(predictions) {
      let topPred = predictions[0];
      for (let i = 1; i < predictions.length; i++) {
        if (predictions[i].probability > topPred.probability) {
          topPred = predictions[i];
        }
      }

      const topLabel = normalizeLabel(topPred.className);
      const topProb = topPred.probability;

      if (topProb >= CONFIDENCE_THRESHOLD) {
        if (candidateState === topLabel) {
          consecutiveCount += 1;
        } else {
          candidateState = topLabel;
          consecutiveCount = 1;
        }

        if (consecutiveCount >= REQUIRED_CONSECUTIVE_FRAMES) {
          applyConfirmedState(topLabel);
        }
      } else {
        candidateState = null;
        consecutiveCount = 0;
      }

      candidateInfoEl.textContent = candidateState
        ? `후보: [${candidateState}] (${Math.min(consecutiveCount, REQUIRED_CONSECUTIVE_FRAMES)}/${REQUIRED_CONSECUTIVE_FRAMES})`
        : `후보: 기준 미달 (< ${Math.round(CONFIDENCE_THRESHOLD * 100)}%)`;
    }

    async function loop() {
      if (!webcam || !model) return;
      webcam.update();
      await predict();
      window.requestAnimationFrame(loop);
    }

    async function predict() {
      const prediction = await model.predict(webcam.canvas);
      processStability(prediction);
      updateBars(prediction, confirmedState);
    }

    async function init() {
      try {
        const modelURL = MODEL_URL + "model.json";
        const metadataURL = MODEL_URL + "metadata.json";

        model = await tmImage.load(modelURL, metadataURL);
        const classLabels = model.getClassLabels();
        buildBars(classLabels);

        const flip = true;
        webcam = new tmImage.Webcam(360, 360, flip);
        await webcam.setup();
        await webcam.play();

        webcamContainerEl.innerHTML = "";
        webcamContainerEl.appendChild(webcam.canvas);

        badgeEl.textContent = "실시간 인식 중";
        badgeEl.classList.add("active");

        if ("speechSynthesis" in window) {
          window.speechSynthesis.getVoices();
        }

        window.requestAnimationFrame(loop);
      } catch (error) {
        console.error("초기화 실패:", error);
        badgeEl.textContent = "시작 오류";
        webcamContainerEl.textContent = "웹캠 또는 모델을 불러오지 못했습니다. 카메라 권한과 로컬 서버 실행 여부를 확인해 주세요.";
      }
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
