<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>실시간 티쳐블머신 인사말 웹앱</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #34d399;
      --warn: #fbbf24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: linear-gradient(135deg, #0b1120 0%, #111827 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 920px;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
    }

    .header h1 {
      font-size: 1.35rem;
      font-weight: 700;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      background: rgba(56, 189, 248, 0.14);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 24px;
    }

    @media (max-width: 760px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .cam-box {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .webcam-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #090d16;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #webcam-container canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
      display: block;
    }

    .greeting-banner {
      min-height: 92px;
      border-radius: 16px;
      padding: 18px 20px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      transition: border-color 0.25s ease, transform 0.25s ease, background 0.25s ease;
    }

    .greeting-banner.active-me {
      border-color: var(--accent-2);
      background: rgba(16, 185, 129, 0.12);
    }

    .greeting-banner.active-friend {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
    }

    .greeting-banner.active-bg {
      border-color: #475569;
      background: rgba(30, 41, 59, 0.65);
    }

    .greeting-tag {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    .greeting-text {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.4;
    }

    .panel {
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel h2 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }

    .prob-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .prob-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .prob-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.92rem;
    }

    .prob-label {
      font-weight: 600;
    }

    .prob-value {
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }

    .bar-track {
      width: 100%;
      height: 12px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width 0.1s linear;
    }

    .settings-box {
      border-top: 1px solid var(--card-border);
      padding-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 0.86rem;
      color: var(--muted);
    }

    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .control-row input[type="range"] {
      width: 120px;
      accent-color: var(--accent);
    }

    .btn {
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: #1e293b;
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn:hover {
      background: #283548;
    }

    .log-text {
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.45;
    }

    .error-msg {
      color: #f87171;
      font-size: 0.9rem;
      padding: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>실시간 얼굴/상황 인식 인사말</h1>
      <div class="status-pill" id="system-status">
        <span class="dot"></span>
        <span>모델 및 웹캠 초기화 중...</span>
      </div>
    </div>

    <div class="grid">
      <div class="cam-box">
        <div class="webcam-wrapper" id="webcam-container">
          <div class="log-text" id="cam-placeholder">웹캠 권한을 허용해 주세요...</div>
        </div>

        <div class="greeting-banner active-bg" id="greeting-banner">
          <div class="greeting-tag" id="greeting-tag">확정 상태: 대기 중</div>
          <div class="greeting-text" id="greeting-text">사람을 기다리는 중입니다.</div>
        </div>
      </div>

      <div class="panel">
        <h2>실시간 인식 확률</h2>
        <div class="prob-list" id="prob-list"></div>

        <div class="settings-box">
          <div class="control-row">
            <label for="threshold-input">확신도 임계값: <strong id="threshold-val">75%</strong></label>
            <input id="threshold-input" type="range" min="50" max="95" step="5" value="75" />
          </div>

          <div class="control-row">
            <label for="frames-input">연속 프레임 수: <strong id="frames-val">6</strong>프레임</label>
            <input id="frames-input" type="range" min="2" max="15" step="1" value="6" />
          </div>

          <div class="control-row">
            <button class="btn" id="test-voice-btn" type="button">한국어 음성 테스트</button>
            <span id="speech-state">음성 대기</span>
          </div>

          <div class="log-text" id="debug-info">
            후보 프레임: 0 / 6 · 마지막 음성: 없음
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- TensorFlow.js & Teachable Machine Image 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

  <script>
    // 티쳐블머신 모델 URL (필요시 변경 가능)
    const MODEL_URL = "https://teachablemachine.withgoogle.com/models/I54hIZYkuf/";

    // 상태 상수
    const STATE_NONE = "NONE";
    const STATE_ME = "ME";         // [나]
    const STATE_FRIEND = "FRIEND"; // [친구] 또는 [안녕하세요]
    const STATE_BG = "BG";         // [배경]

    let model = null;
    let webcam = null;
    let maxPredictions = 0;

    // 흔들림 방지를 위한 연속 프레임 추적 상태
    let confidenceThreshold = 0.75;
    let requiredConsecutiveFrames = 6;
    let candidateState = STATE_NONE;
    let consecutiveCount = 0;
    let confirmedState = STATE_NONE;

    const probBarEls = new Map();

    const statusEl = document.getElementById("system-status");
    const camContainerEl = document.getElementById("webcam-container");
    const camPlaceholderEl = document.getElementById("cam-placeholder");
    const probListEl = document.getElementById("prob-list");
    const greetingBannerEl = document.getElementById("greeting-banner");
    const greetingTagEl = document.getElementById("greeting-tag");
    const greetingTextEl = document.getElementById("greeting-text");
    const thresholdInput = document.getElementById("threshold-input");
    const thresholdVal = document.getElementById("threshold-val");
    const framesInput = document.getElementById("frames-input");
    const framesVal = document.getElementById("frames-val");
    const testVoiceBtn = document.getElementById("test-voice-btn");
    const speechStateEl = document.getElementById("speech-state");
    const debugInfoEl = document.getElementById("debug-info");

    thresholdInput.addEventListener("input", () => {
      confidenceThreshold = Number(thresholdInput.value) / 100;
      thresholdVal.textContent = `${thresholdInput.value}%`;
    });

    framesInput.addEventListener("input", () => {
      requiredConsecutiveFrames = Number(framesInput.value);
      framesVal.textContent = framesInput.value;
      consecutiveCount = 0;
    });

    testVoiceBtn.addEventListener("click", () => {
      speakKorean("한국어 음성 출력이 정상 작동합니다.");
    });

    // 레이블 문자열을 표준 상태로 매핑
    function mapLabelToState(rawLabel) {
      const normalized = (rawLabel || "").replace(/[\[\]\s]/g, "").toLowerCase();
      if (normalized === "나" || normalized === "me") return STATE_ME;
      if (normalized === "친구" || normalized === "friend" || normalized === "안녕하세요") return STATE_FRIEND;
      if (normalized === "배경" || normalized === "background" || normalized === "bg") return STATE_BG;
      return STATE_NONE;
    }

    // 확률 막대그래프 UI 초기화
    function initProbabilityBars(classLabels) {
      probListEl.innerHTML = "";
      probBarEls.clear();

      classLabels.forEach((label) => {
        const item = document.createElement("div");
        item.className = "prob-item";

        const meta = document.createElement("div");
        meta.className = "prob-meta";

        const nameSpan = document.createElement("span");
        nameSpan.className = "prob-label";
        nameSpan.textContent = label;

        const valSpan = document.createElement("span");
        valSpan.className = "prob-value";
        valSpan.textContent = "0.0%";

        const track = document.createElement("div");
        track.className = "bar-track";

        const fill = document.createElement("div");
        fill.className = "bar-fill";

        track.appendChild(fill);
        meta.appendChild(nameSpan);
        meta.appendChild(valSpan);
        item.appendChild(meta);
        item.appendChild(track);
        probListEl.appendChild(item);

        probBarEls.set(label, { valSpan, fill });
      });
    }

    // 확률 막대그래프 업데이트
    function updateProbabilityBars(predictions) {
      for (const pred of predictions) {
        const target = probBarEls.get(pred.className);
        if (!target) continue;
        const pct = (pred.probability * 100).toFixed(1);
        target.valSpan.textContent = `${pct}%`;
        target.fill.style.width = `${Math.min(100, Math.max(0, pred.probability * 100))}%`;
      }
    }

    // 한국어 음성(Web Speech API) 출력
    function speakKorean(text) {
      if (!("speechSynthesis" in window)) {
        speechStateEl.textContent = "음성 미지원 브라우저";
        return;
      }

      try {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "ko-KR";
        utterance.rate = 1.0;
        utterance.pitch = 1.0;

        const voices = window.speechSynthesis.getVoices();
        const koVoice = voices.find((v) => v.lang && v.lang.toLowerCase().startsWith("ko"));
        if (koVoice) {
          utterance.voice = koVoice;
        }

        utterance.onstart = () => {
          speechStateEl.textContent = "말하는 중...";
        };
        utterance.onend = () => {
          speechStateEl.textContent = "음성 대기";
        };
        utterance.onerror = () => {
          speechStateEl.textContent = "음성 재생 확인 필요";
        };

        window.speechSynthesis.speak(utterance);
        debugInfoEl.textContent = `후보 프레임: ${consecutiveCount} / ${requiredConsecutiveFrames} · 마지막 음성: "${text}"`;
      } catch (err) {
        speechStateEl.textContent = "음성 오류";
      }
    }

    // 확정된 상태에 따른 화면 및 음성 처리 (상태가 바뀔 때만 1회 실행)
    function applyConfirmedState(newState) {
      const prevState = confirmedState;
      confirmedState = newState;

      greetingBannerEl.classList.remove("active-me", "active-friend", "active-bg");

      if (newState === STATE_ME) {
        const message = "환영합니다! 오늘도 좋은 하루 보내세요.";
        greetingBannerEl.classList.add("active-me");
        greetingTagEl.textContent = "확정 상태: [나]";
        greetingTextEl.textContent = message;

        if (prevState !== STATE_ME) {
          speakKorean(message);
        }
      } else if (newState === STATE_FRIEND) {
        const message = "안녕하세요? 용건을 말해주세요";
        greetingBannerEl.classList.add("active-friend");
        greetingTagEl.textContent = "확정 상태: [친구 / 안녕하세요]";
        greetingTextEl.textContent = message;

        if (prevState !== STATE_FRIEND) {
          speakKorean(message);
        }
      } else if (newState === STATE_BG) {
        greetingBannerEl.classList.add("active-bg");
        greetingTagEl.textContent = "확정 상태: [배경]";
        greetingTextEl.textContent = "사람이 없습니다. (인사말 없음)";
      }
    }

    // 프레임별 예측 처리 및 연속 프레임 안정화
    async function predictFrame() {
      if (!model || !webcam) return;

      const prediction = await model.predict(webcam.canvas);
      updateProbabilityBars(prediction);

      // 가장 높은 확률의 클래스 찾기
      let topPred = prediction[0];
      for (const p of prediction) {
        if (p.probability > topPred.probability) {
          topPred = p;
        }
      }

      const mapped = topPred && topPred.probability >= confidenceThreshold
        ? mapLabelToState(topPred.className)
        : STATE_NONE;

      if (mapped !== STATE_NONE && mapped === candidateState) {
        consecutiveCount += 1;
      } else if (mapped !== STATE_NONE) {
        candidateState = mapped;
        consecutiveCount = 1;
      } else {
        candidateState = STATE_NONE;
        consecutiveCount = 0;
      }

      if (consecutiveCount >= requiredConsecutiveFrames && candidateState !== STATE_NONE) {
        applyConfirmedState(candidateState);
      }

      debugInfoEl.textContent =
        `후보 프레임: ${consecutiveCount} / ${requiredConsecutiveFrames} (${topPred ? topPred.className : "-"} ${topPred ? (topPred.probability * 100).toFixed(0) : 0}%)`;
    }

    async function loop() {
      webcam.update();
      await predictFrame();
      window.requestAnimationFrame(loop);
    }

    async function init() {
      try {
        if ("speechSynthesis" in window) {
          window.speechSynthesis.getVoices();
        }

        const modelURL = MODEL_URL.endsWith("/") ? MODEL_URL + "model.json" : MODEL_URL + "/model.json";
        const metadataURL = MODEL_URL.endsWith("/") ? MODEL_URL + "metadata.json" : MODEL_URL + "/metadata.json";

        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        const labels = model.getClassLabels ? model.getClassLabels() : ["나", "안녕하세요", "배경"];
        initProbabilityBars(labels);

        const flip = true; // 전면 카메라 좌우 반전
        webcam = new tmImage.Webcam(480, 360, flip);
        await webcam.setup();
        await webcam.play();

        camPlaceholderEl?.remove();
        camContainerEl.innerHTML = "";
        camContainerEl.appendChild(webcam.canvas);

        statusEl.innerHTML = '<span class="dot"></span><span>실시간 인식 실행 중</span>';
        window.requestAnimationFrame(loop);
      } catch (err) {
        console.error(err);
        statusEl.textContent = "초기화 오류";
        camContainerEl.innerHTML =
          `<div class="error-msg">웹캠 또는 모델을 불러오지 못했습니다.<br/>카메라 권한 및 HTTPS/로컬 서버 환경을 확인해 주세요.<br/>(${err.message || err})</div>`;
      }
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
