<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediaPipe Hand Energy &amp; Pop-up Effect</title>
  <style>
    :root {
      --bg: #0b0f19;
      --panel: rgba(17, 24, 39, 0.78);
      --border: rgba(255, 255, 255, 0.14);
      --text: #f9fafb;
      --muted: #9ca3af;
      --accent: #38bdf8;
      --accent-2: #a855f7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      gap: 14px;
    }

    .header {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 12px 18px;
    }

    .title-group h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .title-group p {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    button {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 9px 15px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .stage-wrapper {
      position: relative;
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      background: #05070d;
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }

    video {
      display: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .hud {
      position: absolute;
      inset: 14px 14px auto 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      gap: 12px;
    }

    .badge {
      background: rgba(11, 15, 25, 0.72);
      border: 1px solid var(--border);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 0.8rem;
      line-height: 1.4;
    }

    .badge strong {
      color: var(--accent);
    }

    .charge-meter {
      width: 180px;
      background: rgba(11, 15, 25, 0.72);
      border: 1px solid var(--border);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 8px 12px;
    }

    .charge-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.76rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .charge-track {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
    }

    .charge-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #818cf8, #f472b6);
      border-radius: 999px;
      transition: width 0.08s linear;
    }

    .status-banner {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(11, 15, 25, 0.78);
      border: 1px solid var(--border);
      backdrop-filter: blur(8px);
      border-radius: 999px;
      padding: 7px 16px;
      font-size: 0.82rem;
      color: #e5e7eb;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-group">
      <h1>Hand Energy Orb &amp; Pop-up Canvas</h1>
      <p>1) 손바닥 펴기 → 2) 주먹/손 오므려 에너지 충전 → 3) 다시 펴서(보자기) 물체·동물 소환!</p>
    </div>
    <div class="controls">
      <button id="toggleSkeletonBtn" type="button">랜드마크 표시: ON</button>
      <button id="restartBtn" type="button">카메라 재시작</button>
    </div>
  </div>

  <div class="stage-wrapper">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="outputCanvas"></canvas>

    <div class="hud">
      <div class="badge">
        <div>손 상태: <strong id="handPoseText">대기 중</strong></div>
        <div>시퀀스: <strong id="phaseText">1. 손을 쫙 펴주세요</strong></div>
      </div>

      <div class="charge-meter">
        <div class="charge-label">
          <span>에너지 충전</span>
          <span id="chargePercent">0%</span>
        </div>
        <div class="charge-track">
          <div class="charge-fill" id="chargeFill"></div>
        </div>
      </div>
    </div>

    <div class="status-banner" id="statusBanner">MediaPipe 손 추적 모델을 불러오는 중입니다...</div>
  </div>

  <script type="module">
    import {
      FilesetResolver,
      HandLandmarker
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

    const video = document.getElementById("webcam");
    const canvas = document.getElementById("outputCanvas");
    const ctx = canvas.getContext("2d");

    const handPoseText = document.getElementById("handPoseText");
    const phaseText = document.getElementById("phaseText");
    const chargePercent = document.getElementById("chargePercent");
    const chargeFill = document.getElementById("chargeFill");
    const statusBanner = document.getElementById("statusBanner");
    const toggleSkeletonBtn = document.getElementById("toggleSkeletonBtn");
    const restartBtn = document.getElementById("restartBtn");

    const SPAWN_ITEMS = [
      { emoji: "🦊", label: "여우" },
      { emoji: "🐼", label: "판다" },
      { emoji: "🦄", label: "유니콘" },
      { emoji: "🐙", label: "문어" },
      { emoji: "🦖", label: "공룡" },
      { emoji: "🦋", label: "나비" },
      { emoji: "🚀", label: "로켓" },
      { emoji: "🍕", label: "피자" },
      { emoji: "💎", label: "다이아몬드" },
      { emoji: "🌈", label: "무지개" },
      { emoji: "🎸", label: "기타" },
      { emoji: " crown".trim(), label: "왕관" }
    ];
    SPAWN_ITEMS[SPAWN_ITEMS.length - 1].emoji = "👑";

    const HAND_CONNECTIONS = [
      [0, 1], [1, 2], [2, 3], [3, 4],
      [0, 5], [5, 6], [6, 7], [7, 8],
      [5, 9], [9, 10], [10, 11], [11, 12],
      [9, 13], [13, 14], [14, 15], [15, 16],
      [13, 17], [17, 18], [18, 19], [19, 20],
      [0, 17]
    ];

    let handLandmarker = null;
    let stream = null;
    let showSkeleton = true;
    let lastVideoTime = -1;
    let lastFrameTime = performance.now();

    // 손 제스처 및 에너지 상태 머신
    // "NEED_OPEN" -> "CHARGING" -> "READY_TO_POP"
    let sequenceState = "NEED_OPEN";
    let charge = 0; // 0 ~ 100
    let lastPalmPos = null; // 캔버스 좌표계 { x, y, scale }

    // 소환된 물체/동물 및 파티클 배열
    const spawnedEntities = [];
    const particles = [];

    function setBanner(msg) {
      statusBanner.textContent = msg;
    }

    function dist2D(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    /**
     * 정규화 랜드마크(0~1)를 기반으로 손이 펴졌는지 / 오므렸는지 판별
     * 손목(0)에서 중지 MCP(9)까지의 길이를 기준 스케일로 사용해 카메라 거리 변화에 강건하게 계산
     */
    function classifyHandPose(landmarks) {
      const wrist = landmarks[0];
      const middleMcp = landmarks[9];
      const palmSize = Math.max(dist2D(wrist, middleMcp), 0.04);

      const tips = [4, 8, 12, 16, 20];
      const pips = [3, 6, 10, 14, 18];

      let extendedCount = 0;
      let avgTipDistRatio = 0;

      for (let i = 0; i < tips.length; i++) {
        const tip = landmarks[tips[i]];
        const pip = landmarks[pips[i]];
        const tipToWrist = dist2D(tip, wrist) / palmSize;
        const pipToWrist = dist2D(pip, wrist) / palmSize;

        avgTipDistRatio += tipToWrist;

        if (i === 0) {
          // 엄지는 검지 MCP(5)와의 거리로 펴짐 판별
          const thumbSpread = dist2D(tip, landmarks[5]) / palmSize;
          if (thumbSpread > 0.62 && tipToWrist > pipToWrist * 1.05) {
            extendedCount++;
          }
        } else {
          if (tipToWrist > pipToWrist * 1.12 && tipToWrist > 1.35) {
            extendedCount++;
          }
        }
      }

      avgTipDistRatio /= tips.length;

      if (extendedCount >= 4 && avgTipDistRatio > 1.45) {
        return "OPEN";
      }
      if (extendedCount <= 1 && avgTipDistRatio < 1.15) {
        return "CLOSED";
      }
      return "PARTIAL";
    }

    function getPalmCenterCanvas(landmarks) {
      // 손목(0), 검지 MCP(5), 중지 MCP(9), 약지 MCP(13), 소지 MCP(17)의 중심
      const indices = [0, 5, 9, 13, 17];
      let nx = 0;
      let ny = 0;
      for (const idx of indices) {
        nx += landmarks[idx].x;
        ny += landmarks[idx].y;
      }
      nx /= indices.length;
      ny /= indices.length;

      // 전면 카메라 좌우 반전(mirror) 매핑
      const x = (1 - nx) * canvas.width;
      const y = ny * canvas.height;
      const palmPx = Math.max(dist2D(landmarks[0], landmarks[9]) * canvas.width, 45);

      return { x, y, palmPx };
    }

    function spawnBurst(x, y, chargeRatio) {
      const item = SPAWN_ITEMS[Math.floor(Math.random() * SPAWN_ITEMS.length)];
      const baseSize = 58 + chargeRatio * 56; // 충전량에 따라 크기 변화

      spawnedEntities.push({
        emoji: item.emoji,
        label: item.label,
        x,
        y: y - 24,
        vy: -260 - chargeRatio * 140,
        vx: (Math.random() - 0.5) * 90,
        targetY: y - 95 - chargeRatio * 45,
        scale: 0.15,
        targetScale: baseSize / 64,
        rotation: (Math.random() - 0.5) * 0.25,
        rotVel: (Math.random() - 0.5) * 1.8,
        age: 0,
        maxAge: 2.8,
        floatPhase: Math.random() * Math.PI * 2
      });

      const particleCount = Math.round(18 + chargeRatio * 28);
      const palette = ["#38bdf8", "#a855f7", "#f472b6", "#facc15", "#34d399"];
      for (let i = 0; i < particleCount; i++) {
        const angle = (Math.PI * 2 * i) / particleCount + (Math.random() - 0.5) * 0.3;
        const speed = 90 + Math.random() * (180 + chargeRatio * 160);
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 50,
          radius: 3 + Math.random() * 5,
          color: palette[i % palette.length],
          alpha: 1,
          life: 0,
          maxLife: 0.55 + Math.random() * 0.45
        });
      }
    }

    function updateSequence(pose, palmPos, dt) {
      if (pose === "OPEN") {
        handPoseText.textContent = "편 손 (보자기)";
      } else if (pose === "CLOSED") {
        handPoseText.textContent = "오므린 손 (충전)";
      } else {
        handPoseText.textContent = "중간 손 모양";
      }

      if (sequenceState === "NEED_OPEN") {
        phaseText.textContent = "1. 손을 쫙 펴주세요";
        charge = Math.max(0, charge - dt * 40);
        if (pose === "OPEN") {
          sequenceState = "CHARGING";
          setBanner("손을 폈습니다! 이제 손을 오므려 에너지 구를 충전하세요.");
        }
      } else if (sequenceState === "CHARGING") {
        if (pose === "CLOSED") {
          charge = Math.min(100, charge + dt * 68);
          phaseText.textContent = "2. 에너지 구 충전 중...";
          if (charge >= 25) {
            setBanner("에너지 충전 중! 다시 손을 펴면 물체·동물이 튀어나옵니다.");
          }
        } else if (pose === "OPEN" && charge >= 25) {
          // 충전 후 다시 손을 펴면 소환!
          const ratio = charge / 100;
          const spawnPos = palmPos || lastPalmPos || { x: canvas.width * 0.5, y: canvas.height * 0.5 };
          spawnBurst(spawnPos.x, spawnPos.y, ratio);
          setBanner(`✨ ${SPAWN_ITEMS[spawnedEntities[spawnedEntities.length - 1].emoji ? 0 : 0]?.label || "아이템"} 소환! 다시 펴서 오므리면 재충전됩니다.`);
          const latest = spawnedEntities[spawnedEntities.length - 1];
          if (latest) {
            setBanner(`✨ ${latest.label} (${latest.emoji}) 소환 완료! (충전량 ${Math.round(charge)}%)`);
          }
          charge = 0;
          sequenceState = "CHARGING";
        } else if (pose === "OPEN" && charge < 25) {
          phaseText.textContent = "2. 손을 오므려 충전하세요";
        } else {
          // 중간 모양일 때는 살짝만 감소
          charge = Math.max(0, charge - dt * 12);
        }
      }

      const pct = Math.round(charge);
      chargePercent.textContent = `${pct}%`;
      chargeFill.style.width = `${pct}%`;
    }

    function drawEnergyOrb(palmPos, chargeAmount, nowSec) {
      if (!palmPos || chargeAmount <= 1) return;

      const ratio = chargeAmount / 100;
      const pulse = 1 + Math.sin(nowSec * 12) * 0.08;
      const radius = (14 + ratio * Math.min(palmPos.palmPx * 0.65, 88)) * pulse;

      ctx.save();
      ctx.globalCompositeOperation = "lighter";

      // 외곽 글로우
      const outerGrad = ctx.createRadialGradient(
        palmPos.x, palmPos.y, radius * 0.1,
        palmPos.x, palmPos.y, radius * 1.65
      );
      outerGrad.addColorStop(0, "rgba(255, 255, 255, 0.95)");
      outerGrad.addColorStop(0.25, "rgba(56, 189, 248, 0.78)");
      outerGrad.addColorStop(0.65, "rgba(168, 85, 247, 0.35)");
      outerGrad.addColorStop(1, "rgba(168, 85, 247, 0)");

      ctx.fillStyle = outerGrad;
      ctx.beginPath();
      ctx.arc(palmPos.x, palmPos.y, radius * 1.65, 0, Math.PI * 2);
      ctx.fill();

      // 회전하는 에너지 링
      ctx.strokeStyle = `rgba(125, 211, 252, ${0.4 + ratio * 0.5})`;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(palmPos.x, palmPos.y, radius * 1.15, nowSec * 4, nowSec * 4 + Math.PI * 1.35);
      ctx.stroke();

      ctx.restore();
    }

    function drawHandLandmarks(landmarks) {
      if (!showSkeleton) return;

      ctx.save();
      ctx.strokeStyle = "rgba(56, 189, 248, 0.75)";
      ctx.lineWidth = 2.5;

      for (const [startIdx, endIdx] of HAND_CONNECTIONS) {
        const a = landmarks[startIdx];
        const b = landmarks[endIdx];
        ctx.beginPath();
        ctx.moveTo((1 - a.x) * canvas.width, a.y * canvas.height);
        ctx.lineTo((1 - b.x) * canvas.width, b.y * canvas.height);
        ctx.stroke();
      }

      for (let i = 0; i < landmarks.length; i++) {
        const lm = landmarks[i];
        const x = (1 - lm.x) * canvas.width;
        const y = lm.y * canvas.height;
        const isTip = [4, 8, 12, 16, 20].includes(i);

        ctx.fillStyle = isTip ? "#f472b6" : "#f8fafc";
        ctx.beginPath();
        ctx.arc(x, y, isTip ? 5.5 : 3.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function updateAndDrawEffects(dt, nowSec) {
      // 파티클 업데이트 & 렌더
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life += dt;
        if (p.life >= p.maxLife) {
          particles.splice(i, 1);
          continue;
        }
        p.vy += 280 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.alpha = 1 - p.life / p.maxLife;

        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 랜덤 물체 / 동물 애니메이션 업데이트 & 렌더
      for (let i = spawnedEntities.length - 1; i >= 0; i--) {
        const ent = spawnedEntities[i];
        ent.age += dt;
        if (ent.age >= ent.maxAge) {
          spawnedEntities.splice(i, 1);
          continue;
        }

        // 스프링 상승 후 부드럽게 부유
        if (ent.age < 0.55) {
          ent.vy += 720 * dt;
          ent.y += ent.vy * dt;
          ent.x += ent.vx * dt;
          ent.scale += (ent.targetScale - ent.scale) * Math.min(1, dt * 14);
          ent.rotation += ent.rotVel * dt;
        } else {
          ent.y += Math.sin(nowSec * 3.5 + ent.floatPhase) * 14 * dt;
          ent.rotation = Math.sin(nowSec * 2.5 + ent.floatPhase) * 0.14;
        }

        const fadeOutStart = ent.maxAge - 0.65;
        const alpha = ent.age > fadeOutStart
          ? Math.max(0, (ent.maxAge - ent.age) / 0.65)
          : 1;

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(ent.x, ent.y);
        ctx.rotate(ent.rotation);
        ctx.scale(ent.scale, ent.scale);

        // 뒤쪽 후광
        const glow = ctx.createRadialGradient(0, 0, 6, 0, 0, 56);
        glow.addColorStop(0, "rgba(250, 204, 21, 0.35)");
        glow.addColorStop(1, "rgba(250, 204, 21, 0)");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(0, 0, 56, 0, Math.PI * 2);
        ctx.fill();

        ctx.font = "64px 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(ent.emoji, 0, 0);

        ctx.restore();
      }
    }

    function renderLoop(nowMs) {
      const nowSec = nowMs * 0.001;
      const dt = Math.min(0.05, Math.max(0.001, (nowMs - lastFrameTime) * 0.001));
      lastFrameTime = nowMs;

      if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
        if (video.videoWidth > 0 && video.videoHeight > 0) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
        }
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (video.readyState >= 2 && canvas.width > 0 && canvas.height > 0) {
        // 전면 카메라 좌우 반전 비디오 그리기
        ctx.save();
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        ctx.restore();

        if (handLandmarker && video.currentTime !== lastVideoTime) {
          lastVideoTime = video.currentTime;
          const results = handLandmarker.detectForVideo(video, nowMs);

          if (results.landmarks && results.landmarks.length > 0) {
            // 가장 큰 손(첫 번째 검출 손) 기준 제스처 및 에너지 구 처리
            const primaryLandmarks = results.landmarks[0];
            const pose = classifyHandPose(primaryLandmarks);
            const palmPos = getPalmCenterCanvas(primaryLandmarks);
            lastPalmPos = palmPos;

            updateSequence(pose, palmPos, dt);

            for (const lm of results.landmarks) {
              drawHandLandmarks(lm);
            }

            if (sequenceState === "CHARGING" || charge > 1) {
              drawEnergyOrb(palmPos, charge, nowSec);
            }
          } else {
            handPoseText.textContent = "손 미검출";
            charge = Math.max(0, charge - dt * 25);
            chargePercent.textContent = `${Math.round(charge)}%`;
            chargeFill.style.width = `${Math.round(charge)}%`;
          }
        }
      }

      updateAndDrawEffects(dt, nowSec);
      requestAnimationFrame(renderLoop);
    }

    async function initMediaPipe() {
      setBanner("MediaPipe Vision WASM 및 손 인식 모델 초기화 중...");
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );

      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 2,
        minHandDetectionConfidence: 0.55,
        minHandPresenceConfidence: 0.55,
        minTrackingConfidence: 0.55
      });
    }

    async function startCamera() {
      if (stream) {
        stream.getTracks().forEach((t) => t.stop());
      }

      setBanner("전면 카메라 권한을 요청하는 중...");
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user",
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });
        video.srcObject = stream;
        await video.play();

        sequenceState = "NEED_OPEN";
        charge = 0;
        chargePercent.textContent = "0%";
        chargeFill.style.width = "0%";
        setBanner("준비 완료! 먼저 손을 완전히 편 뒤 오므려 에너지를 충전하세요.");
      } catch (err) {
        console.error(err);
        setBanner("카메라 접근에 실패했습니다. HTTPS 또는 localhost 환경과 권한을 확인해 주세요.");
      }
    }

    toggleSkeletonBtn.addEventListener("click", () => {
      showSkeleton = !showSkeleton;
      toggleSkeletonBtn.textContent = `랜드마크 표시: ${showSkeleton ? "ON" : "OFF"}`;
    });

    restartBtn.addEventListener("click", async () => {
      restartBtn.disabled = true;
      await startCamera();
      restartBtn.disabled = false;
    });

    (async () => {
      try {
        await initMediaPipe();
        await startCamera();
        requestAnimationFrame(renderLoop);
      } catch (err) {
        console.error(err);
        setBanner("초기화 중 오류가 발생했습니다. 네트워크 상태를 확인해 주세요.");
      }
    })();
  </script>
</body>
</html>
