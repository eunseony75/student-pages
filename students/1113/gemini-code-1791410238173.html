
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ENERGY BLASTER AR</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#050713;color:white;
 font-family:Arial,sans-serif;overflow:hidden;
}
#stage{position:relative;width:100vw;height:100vh;
 background:radial-gradient(circle,#101d40,#03050c);
 overflow:hidden}
video,canvas{
 position:absolute;width:100%;height:100%;
 object-fit:cover;transform:scaleX(-1);
}
canvas{pointer-events:none}
#ui{
 position:absolute;top:20px;left:0;width:100%;
 text-align:center;z-index:5;pointer-events:none;
}
h1{font-size:22px;letter-spacing:5px;
 color:#65eaff;text-shadow:0 0 18px #00cfff}
#status{font-size:15px;color:white;margin-top:10px}
#charge{
 width:190px;height:7px;background:#18213a;
 margin:15px auto;border-radius:10px;overflow:hidden;
}
#bar{height:100%;width:0%;
 background:linear-gradient(90deg,#00eaff,#d500ff);
 box-shadow:0 0 15px #00eaff;
 transition:width .1s}
#start{
 position:absolute;z-index:10;top:50%;left:50%;
 transform:translate(-50%,-50%);
 background:#061b36;color:#65f5ff;
 border:1px solid #00dfff;padding:18px 30px;
 border-radius:12px;font-size:17px;
 box-shadow:0 0 30px #008cff;cursor:pointer;
}
#help{
 position:absolute;bottom:25px;width:100%;
 text-align:center;color:#9cb6dc;
 font-size:12px;line-height:2;z-index:5;
}
</style>
</head>
<body>
<div id="stage">
 <video id="video" autoplay playsinline></video>
 <canvas id="canvas"></canvas>

 <div id="ui">
  <h1>✦ ENERGY BLASTER ✦</h1>
  <div id="status">SYSTEM READY</div>
  <div id="charge"><div id="bar"></div></div>
 </div>

 <button id="start">START AR EXPERIENCE</button>

 <div id="help">
  ✋ 손바닥 펼치기 : 인식 및 대기<br>
  ✊ 주먹 쥐기 : 에너지 충전<br>
  ✋ 다시 펼치기 : 에너지 발사
 </div>
</div>

<script type="module">
import {
 HandLandmarker,
 FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video=document.querySelector("#video");
const canvas=document.querySelector("#canvas");
const ctx=canvas.getContext("2d");
const status=document.querySelector("#status");
const bar=document.querySelector("#bar");
const start=document.querySelector("#start");

let tracker=null;
let lastTime=-1;
let gesture="none";
let previousGesture="none";
let charged=false;
let charge=0;
let effects=[];
let particles=[];
let lastShot=0;
let hand=null;

const W=()=>canvas.width;
const H=()=>canvas.height;

function resize(){
 canvas.width=innerWidth*devicePixelRatio;
 canvas.height=innerHeight*devicePixelRatio;
}
addEventListener("resize",resize);
resize();

async function initialize(){
 start.textContent="LOADING...";
 try{
  const vision=await FilesetResolver.forVisionTasks(
   "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );

  tracker=await HandLandmarker.createFromOptions(vision,{
   baseOptions:{
    modelAssetPath:
    "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
    delegate:"GPU"
   },
   runningMode:"VIDEO",
   numHands:1
  });

  const stream=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:"user",width:1280,height:720},
   audio:false
  });
  video.srcObject=stream;
  await video.play();
  start.style.display="none";
  status.textContent="SCAN YOUR HAND";
  requestAnimationFrame(loop);
 }catch(e){
  status.textContent="CAMERA ERROR: "+e.message;
  start.textContent="RETRY";
 }
}
start.onclick=initialize;

// 손가락이 펴졌는지 판단
function distance(a,b){
 return Math.hypot(a.x-b.x,a.y-b.y);
}

function classify(lm){
 const wrist=lm[0];
 const tips=[8,12,16,20];
 const bases=[5,9,13,17];

 let extended=0;
 for(let i=0;i<4;i++){
  if(distance(lm[tips[i]],wrist)>
     distance(lm[bases[i]],wrist)*1.23) extended++;
 }

 // 엄지
 if(distance(lm[4],lm[0])>
    distance(lm[2],lm[0])*1.25) extended++;

 if(extended>=4)return "open";
 if(extended<=1)return "fist";
 return "other";
}

function point(lm){
 return {
  x:(1-lm[9].x)*W(),
  y:lm[9].y*H()
 };
}

function palmAngle(lm){
 const a=lm[5],b=lm[17];
 return Math.atan2(
  (b.y-a.y)*H(),
  ((1-b.x)-(1-a.x))*W()
 );
}

function spawn(x,y,count,color){
 for(let i=0;i<count;i++){
  const angle=Math.random()*Math.PI*2;
  const speed=1+Math.random()*8;
  particles.push({
   x,y,
   vx:Math.cos(angle)*speed,
   vy:Math.sin(angle)*speed,
   life:30+Math.random()*35,
   max:65,
   size:1+Math.random()*4,
   color
  });
 }
}

function shoot(p,angle){
 const dx=Math.cos(angle-Math.PI/2);
 const dy=Math.sin(angle-Math.PI/2);

 effects.push({
  type:"shot",x:p.x,y:p.y,
  vx:dx*30,vy:dy*30,
  life:1,max:1,
  length:220
 });

 spawn(p.x,p.y,90,"#62eeff");
 lastShot=performance.now();
 status.textContent="✦ ENERGY RELEASED ✦";
}

function drawGun(p,angle){
 ctx.save();
 ctx.translate(p.x,p.y);
 ctx.rotate(angle);

 // 손바닥 중심에 붙는 에너지 코어
 const pulse=1+Math.sin(performance.now()*.008)*.12;
 ctx.scale(pulse,pulse);

 ctx.shadowBlur=25;
 ctx.shadowColor="#00dfff";

 // 무기 본체
 ctx.fillStyle="#101c38";
 ctx.strokeStyle="#65f5ff";
 ctx.lineWidth=2;

 ctx.beginPath();
 ctx.roundRect(-17,-60,34,90,9);
 ctx.fill();ctx.stroke();

 // 총구 에너지 코어
 const gradient=ctx.createRadialGradient(0,-45,1,0,-45,22);
 gradient.addColorStop(0,"#ffffff");
 gradient.addColorStop(.3,"#00eeff");
 gradient.addColorStop(1,"#143caa");

 ctx.fillStyle=gradient;
 ctx.beginPath();
 ctx.arc(0,-45,19,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="#a7faff";
 ctx.fillRect(-8,-70,16,9);

 // 측면 에너지 라인
 ctx.strokeStyle="#d500ff";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.moveTo(-12,-20);ctx.lineTo(-12,15);
 ctx.moveTo(12,-20);ctx.lineTo(12,15);
 ctx.stroke();

 ctx.restore();
}

function drawCharging(p){
 const t=performance.now()*.008;
 ctx.save();
 ctx.translate(p.x,p.y);

 for(let i=0;i<3;i++){
  ctx.beginPath();
  ctx.strokeStyle=i%2?"#d500ff":"#00eaff";
  ctx.lineWidth=2;
  ctx.globalAlpha=.6;
  ctx.arc(0,0,30+i*14,t+i*2,t+i*2+Math.PI*1.6);
  ctx.stroke();
 }

 ctx.restore();
}

function drawParticles(){
 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];
  p.x+=p.vx;p.y+=p.vy;
  p.vx*=.97;p.vy*=.97;
  p.life--;

  ctx.globalAlpha=Math.max(0,p.life/p.max);
  ctx.fillStyle=p.color;
  ctx.shadowBlur=15;
  ctx.shadowColor=p.color;
  ctx.beginPath();
  ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
  ctx.fill();

  if(p.life<=0)particles.splice(i,1);
 }
 ctx.globalAlpha=1;
 ctx.shadowBlur=0;
}

function drawShots(){
 for(let i=effects.length-1;i>=0;i--){
  const e=effects[i];

  if(e.type==="shot"){
   e.x+=e.vx;e.y+=e.vy;
   e.life+=.025;

   ctx.save();
   ctx.globalCompositeOperation="lighter";
   ctx.lineCap="round";

   const g=ctx.createLinearGradient(
    e.x,e.y,e.x-e.vx*7,e.y-e.vy*7
   );
   g.addColorStop(0,"#ffffff");
   g.addColorStop(.2,"#00eaff");
   g.addColorStop(1,"rgba(80,0,255,0)");

   ctx.strokeStyle=g;
   ctx.lineWidth=16;
   ctx.shadowBlur=35;
   ctx.shadowColor="#00dfff";
   ctx.beginPath();
   ctx.moveTo(e.x,e.y);
   ctx.lineTo(e.x-e.vx*7,e.y-e.vy*7);
   ctx.stroke();

   ctx.fillStyle="#fff";
   ctx.beginPath();
   ctx.arc(e.x,e.y,9,0,Math.PI*2);
   ctx.fill();

   ctx.restore();

   if(e.x<0||e.x>W()||e.y<0||e.y>H()){
    effects.splice(i,1);
   }
  }
 }
}

function loop(){
 requestAnimationFrame(loop);
 if(!tracker||video.readyState<2)return;

 ctx.clearRect(0,0,W(),H());

 if(video.currentTime!==lastTime){
  lastTime=video.currentTime;
  const result=tracker.detectForVideo(video,performance.now());

  if(result.landmarks.length){
   hand=result.landmarks[0];
   gesture=classify(hand);
  }else{
   hand=null;gesture="none";
  }

  if(gesture==="open"&&previousGesture==="fist"&&charged){
   const p=point(hand);
   shoot(p,palmAngle(hand));
   charged=false;
   charge=0;
  }

  if(gesture==="fist"&&previousGesture==="open"){
   charged=true;
   charge=0;
   status.textContent="⚡ CHARGING...";
  }

  if(gesture==="fist"&&charged){
   charge=Math.min(100,charge+2);
  }

  if(gesture==="open"){
   status.textContent="HAND DETECTED";
  }

  if(gesture==="none"){
   status.textContent="SEARCHING HAND...";
  }

  previousGesture=gesture;
 }

 if(hand){
  const p=point(hand);
  const angle=palmAngle(hand);

  drawGun(p,angle);

  if(charged){
   drawCharging(p);
   spawn(
    p.x+(Math.random()-.5)*50,
    p.y+(Math.random()-.5)*50,
    1,"#a500ff"
   );
   status.textContent="⚡ ENERGY CHARGING "+Math.floor(charge)+"%";
  }
 }

 bar.style.width=charge+"%";

 drawShots();
 drawParticles();
}
</script>
</body>
</html>
