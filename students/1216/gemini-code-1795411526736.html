<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>실시간 얼굴 인식 인사말 웹앱</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent-jb: #38bdf8;
      --accent-dw: #34d399;
      --accent-bg: #64748b;
      --warn: #fbbf24;
      --danger: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 65%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
    }

    .container {
      width: 100%;
      max-width: 920px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px 20px;
      backdrop-filter: blur(10px);
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.875rem;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--card-border);
      color: var(--muted);
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--warn);
      box-shadow: 0 0 8px var(--warn);
    }

    .dot.ready {
      background: var(--accent-dw);
      box-shadow: 0 0 8px var(--accent-dw);
    }

    .dot.error {
      background: var(--danger);
      box-shadow: 0 0 8px var(--danger);
    }

    .notice-banner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.35);
      color: #fde68a;
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .notice-banner.unlocked {
      background: rgba(52, 211, 153, 0.12);
      border-color: rgba(52, 211, 153, 0.35);
      color: #a7f3d0;
    }

    button {
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease;
    }

    button:hover {
      background: #0369a1;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 760px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 18px;
      backdrop-filter: blur(10px);
    }

    .webcam-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 14px;
      overflow: hidden;
      background: #020617;
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .webcam-wrapper canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .greeting-box {
      margin-top: 16px;
      padding: 18px;
      border-radius: 14px;
      background: #0f172a;
      border: 1px solid var(--card-border);
      min-height: 106px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .greeting-box.state-이재빈 {
      border-color: var(--accent-jb);
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.16);
    }

    .greeting-box.state-유동욱 {
      border-color: var(--accent-dw);
      box-shadow: 0 0 24px rgba(52, 211, 153, 0.16);
    }

    .greeting-label {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    .greeting-box.state-이재빈 .greeting-label {
      color: var(--accent-jb);
    }

    .greeting-box.state-유동욱 .greeting-label {
      color: var(--accent-dw);
    }

    .greeting-message {
      font-size: 1.3rem;
      font-weight: 700;
      line-height: 1.4;
      word-break: keep-all;
    }

    .prob-card h2 {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .prob-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .prob-item {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 12px;
      padding: 12px 14px;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .prob-item.active {
      border-color: rgba(248, 250, 252, 0.45);
      background: rgba(15, 23, 42, 0.95);
    }

    .prob-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .prob-value {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }

    .bar-track {
      width: 100%;
      height: 12px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      transition: width 0.12s linear;
      background: var(--accent-bg);
    }

    .bar-fill.label-이재빈 {
      background: linear-gradient(90deg, #0284c7, var(--accent-jb));
    }

    .bar-fill.label-유동욱 {
      background: linear-gradient(90deg, #059669, var(--accent-dw));
    }

    .bar-fill.label-배경 {
      background: linear-gradient(90deg, #475569, #94a3b8);
    }

    .meta-info {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid rgba(148, 163, 184, 0.15);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .meta-box {
      background: rgba(15, 23, 42, 0.5);
      padding: 10px 12px;
      border-radius: 10px;
    }

    .meta-box strong {
      display: block;
      color: var(--text);
      margin-top: 3px;
      font-size: 0.92rem;
    }

    .error-msg {
      color: #fca5a5;
      font-size: 0.9rem;
      padding: 16px;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>실시간 얼굴 인식 인사말 웹앱</h1>
      <div class="status-pill">
        <span id="statusDot" class="dot"></span>
        <span id="statusText">모델 및 웹캠 초기화 중...</span>
      </div>
    </header>

    <div id="speechBanner" class="notice-banner">
      <span>브라우저 정책에 따라 최초 1회 화면 클릭 후 한국어 음성 안내가 안정적으로 재생됩니다.</span>
      <button id="enableSpeechBtn" type="button">음성 활성화 및 테스트</button>
    </div>

    <div class="main-grid">
      <section class="card">
        <div id="webcamContainer" class="webcam-wrapper">
          <div id="webcamPlaceholder" class="error-msg">웹캠을 불러오는 중입니다...</div>
        </div>

        <div id="greetingBox" class="greeting-box state-배경">
          <div id="greetingLabel" class="greeting-label">대기 중 (배경)</div>
          <div id="greetingMessage" class="greeting-message">사람이 감지되지 않았습니다.</div>
        </div>
      </section>

      <aside class="card prob-card">
        <h2>
          <span>실시간 인식 확률</span>
          <span id="topCandidateText" style="font-size: 0.82rem; color: var(--muted); font-weight: 500;">-</span>
        </h2>

        <div id="probList" class="prob-list">
          <div class="prob-item" data-label="이재빈">
            <div class="prob-header">
              <span>이재빈</span>
              <span class="prob-value" id="val-이재빈">0.0%</span>
            </div>
            <div class="bar-track">
              <div class="bar-fill label-이재빈" id="bar-이재빈"></div>
            </div>
          </div>

          <div class="prob-item" data-label="유동욱">
            <div class="prob-header">
              <span>유동욱</span>
              <span class="prob-value" id="val-유동욱">0.0%</span>
            </div>
            <div class="bar-track">
              <div class="bar-fill label-유동욱" id="bar-유동욱"></div>
            </div>
          </div>

          <div class="prob-item" data-label="배경">
            <div class="prob-header">
              <span>배경</span>
              <span class="prob-value" id="val-배경">0.0%</span>
            </div>
            <div class="bar-track">
              <div class="bar-fill label-배경" id="bar-배경"></div>
            </div>
          </div>
        </div>

        <div class="meta-info">
          <div class="meta-box">
            확정 상태
            <strong id="confirmedStateText">배경</strong>
          </div>
          <div class="meta-box">
            연속 감지 카운트
            <strong id="streakText">0 / 6 프레임</strong>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <!-- TensorFlow.js & Teachable Machine Image Library -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

  <script>
    const MODEL_URL = "https://teachablemachine.withgoogle.com/models/hnoCbuGBF/";

    // 프레임 흔들림 방지 설정
    const CONFIDENCE_THRESHOLD = 0.78; // 최소 확신도 (78% 이상)
    const REQUIRED_STREAK = 6;         // 연속 감지 필요 프레임 수

    const LABELS = ["이재빈", "유동욱", "배경"];

    const GREETINGS = {
      "이재빈": {
        labelText: "환영 인사 · 이재빈",
        displayText: "이재빈님, 환영합니다! 오늘도 좋은 하루 되세요.",
        speechText: "이재빈님, 환영합니다!"
      },
      "유동욱": {
        labelText: "안내 메시지 · 유동욱",
        displayText: "안녕하세요? 용건을 말해주세요",
        speechText: "안녕하세요? 용건을 말해주세요"
      },
      "배경": {
        labelText: "대기 중 (배경)",
        displayText: "사람이 감지되지 않았습니다.",
        speechText: ""
      }
    };

    let model = null;
    let webcam = null;
    let isRunning = false;

    // 상태 확정 및 중복 발화 방지 변수
    let confirmedState = "배경";   // 현재 확정된 상태 ("이재빈" | "유동욱" | "배경")
    let lastSpokenState = "배경";  // 마지막으로 음성 출력한 상태
    let candidateLabel = "배경";
    let candidateStreak = 0;
    let speechUnlocked = false;

    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const webcamContainer = document.getElementById("webcamContainer");
    const webcamPlaceholder = document.getElementById("webcamPlaceholder");
    const greetingBox = document.getElementById("greetingBox");
    const greetingLabel = document.getElementById("greetingLabel");
    const greetingMessage = document.getElementById("greetingMessage");
    const topCandidateText = document.getElementById("topCandidateText");
    const confirmedStateText = document.getElementById("confirmedStateText");
    const streakText = document.getElementById("streakText");
    const speechBanner = document.getElementById("speechBanner");
    const enableSpeechBtn = document.getElementById("enableSpeechBtn");

    function setStatus(type, text) {
      statusDot.className = "dot" + (type ? ` ${type}` : "");
      statusText.textContent = text;
    }

    function markSpeechUnlocked() {
      if (!speechUnlocked) {
        speechUnlocked = true;
        speechBanner.classList.add("unlocked");
        speechBanner.querySelector("span").textContent = "한국어 음성 안내가 활성화되었습니다.";
      }
    }

    function getKoreanVoice() {
      if (!("speechSynthesis" in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      return (
        voices.find(v => v.lang && v.lang.toLowerCase().startsWith("ko")) ||
        null
      );
    }

    function speakKorean(text) {
      if (!text || !("speechSynthesis" in window)) return;
      try {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "ko-KR";
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        const koVoice = getKoreanVoice();
        if (koVoice) {
          utterance.voice = koVoice;
        }
        window.speechSynthesis.speak(utterance);
      } catch (err) {
        console.warn("음성 합성 오류:", err);
      }
    }

    enableSpeechBtn.addEventListener("click", () => {
      markSpeechUnlocked();
      speakKorean("음성 안내가 활성화되었습니다.");
    });

    // 첫 사용자 클릭 시 오디오 정책 해제
    document.addEventListener("pointerdown", () => {
      markSpeechUnlocked();
    }, { once: true });

    if ("speechSynthesis" in window) {
      window.speechSynthesis.onvoiceschanged = () => getKoreanVoice();
    }

    function updateProbBars(predictions) {
      const probMap = {};
      predictions.forEach(p => {
        probMap[p.className] = p.probability;
      });

      let highestLabel = LABELS[0];
      let highestProb = -1;

      LABELS.forEach(label => {
        const prob = typeof probMap[label] === "number" ? probMap[label] : 0;
        const pct = (prob * 100).toFixed(1);

        const valEl = document.getElementById(`val-${label}`);
        const barEl = document.getElementById(`bar-${label}`);
        const itemEl = document.querySelector(`.prob-item[data-label="${label}"]`);

        if (valEl) valEl.textContent = `${pct}%`;
        if (barEl) barEl.style.width = `${(prob * 100).toFixed(1)}%`;
        if (itemEl) itemEl.classList.toggle("active", confirmedState === label);

        if (prob > highestProb) {
          highestProb = prob;
          highestLabel = label;
        }
      });

      topCandidateText.textContent = `최고 확률: ${highestLabel} (${(highestProb * 100).toFixed(1)}%)`;
      return { highestLabel, highestProb };
    }

    function applyConfirmedState(nextState) {
      const prevState = confirmedState;
      confirmedState = nextState;

      const info = GREETINGS[nextState] || GREETINGS["배경"];
      greetingBox.className = `greeting-box state-${nextState}`;
      greetingLabel.textContent = info.labelText;
      greetingMessage.textContent = info.displayText;
      confirmedStateText.textContent = nextState;

      // 이전 상태와 다른 상태로 바뀔 때만 1회 말하기 (동일 상태 유지 시 중복 발화 금지)
      if (nextState !== prevState && nextState !== lastSpokenState) {
        lastSpokenState = nextState;
        if (nextState === "이재빈" || nextState === "유동욱") {
          speakKorean(info.speechText);
        } else if (nextState === "배경") {
          // 사람이 사라져 배경으로 돌아갈 때 진행 중이던 발화 정리
          if ("speechSynthesis" in window) {
            window.speechSynthesis.cancel();
          }
        }
      }
    }

    function processStability(highestLabel, highestProb) {
      // 확신도 기준 미달이거나 알 수 없는 라벨이면 배경 쪽으로 보수 처리
      const observedLabel =
        highestProb >= CONFIDENCE_THRESHOLD && LABELS.includes(highestLabel)
          ? highestLabel
          : "배경";

      if (observedLabel === candidateLabel) {
        candidateStreak += 1;
      } else {
        candidateLabel = observedLabel;
        candidateStreak = 1;
      }

      streakText.textContent = `${Math.min(candidateStreak, REQUIRED_STREAK)} / ${REQUIRED_STREAK} 프레임 (${candidateLabel})`;

      if (candidateStreak >= REQUIRED_STREAK && confirmedState !== candidateLabel) {
        applyConfirmedState(candidateLabel);
      }
    }

    async function loop() {
      if (!isRunning || !webcam || !model) return;
      webcam.update();
      await predict();
      window.requestAnimationFrame(loop);
    }

    async function predict() {
      const predictions = await model.predict(webcam.canvas);
      const { highestLabel, highestProb } = updateProbBars(predictions);
      processStability(highestLabel, highestProb);
    }

    async function init() {
      try {
        if (!window.tmImage) {
          throw new Error("Teachable Machine 라이브러리를 불러오지 못했습니다.");
        }

        setStatus("", "티쳐블머신 모델 로딩 중...");
        const modelURL = MODEL_URL + "model.json";
        const metadataURL = MODEL_URL + "metadata.json";
        model = await window.tmImage.load(modelURL, metadataURL);

        setStatus("", "웹캠 권한 요청 및 시작 중...");
        const flip = false; // CSS에서 좌우 반전 처리
        webcam = new window.tmImage.Webcam(480, 360, flip);
        await webcam.setup();
        await webcam.play();

        webcamPlaceholder.remove();
        webcamContainer.innerHTML = "";
        webcamContainer.appendChild(webcam.canvas);

        isRunning = true;
        setStatus("ready", "실시간 인식 실행 중");
        window.requestAnimationFrame(loop);
      } catch (err) {
        console.error(err);
        setStatus("error", "초기화 실패");
        webcamPlaceholder.innerHTML = `
          초기화에 실패했습니다.<br />
          카메라 권한 허용 여부와 HTTPS/로컬 서버 환경을 확인해주세요.<br />
          <small style="opacity:0.75;">(${err.message || err})</small>
        `;
      }
    }

    // 페이지 로드 즉시 자동 시작
    window.addEventListener("DOMContentLoaded", () => {
      applyConfirmedState("배경");
      init();
    });
  </script>
</body>
</html>
