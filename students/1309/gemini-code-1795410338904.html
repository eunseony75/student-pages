<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>실시간 얼굴 인식 인사말</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent-me: #38bdf8;
      --accent-lee: #34d399;
      --accent-bg: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 860px;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 24px;
    }

    @media (max-width: 760px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .camera-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .webcam-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #020617;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .webcam-wrapper canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
      display: block;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.875rem;
      color: var(--muted);
      padding: 0 4px;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fbbf24;
      margin-right: 6px;
    }

    .dot.active {
      background: #22c55e;
    }

    .dot.error {
      background: #ef4444;
    }

    .info-panel {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 20px;
    }

    .greeting-box {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      min-height: 148px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      transition: border-color 0.25s ease, transform 0.25s ease;
    }

    .greeting-box.state-me {
      border-color: var(--accent-me);
    }

    .greeting-box.state-lee {
      border-color: var(--accent-lee);
    }

    .badge {
      display: inline-block;
      width: fit-content;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.15);
      color: var(--muted);
    }

    .greeting-box.state-me .badge {
      background: rgba(56, 189, 248, 0.18);
      color: var(--accent-me);
    }

    .greeting-box.state-lee .badge {
      background: rgba(52, 211, 153, 0.18);
      color: var(--accent-lee);
    }

    .greeting-title {
      font-size: 1.45rem;
      font-weight: 700;
      line-height: 1.35;
    }

    .greeting-sub {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .bars {
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 18px;
    }

    .bars-heading {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted);
    }

    .bar-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .bar-label-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .bar-track {
      width: 100%;
      height: 12px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      transition: width 0.12s linear;
      background: var(--accent-bg);
    }

    .bar-fill[data-label="나"] {
      background: var(--accent-me);
    }

    .bar-fill[data-label="이주형"] {
      background: var(--accent-lee);
    }

    .bar-fill[data-label="배경"] {
      background: var(--accent-bg);
    }

    .debounce-hint {
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="camera-panel">
      <div class="webcam-wrapper" id="webcam-container">
        <span id="loading-text" style="color:#94a3b8;font-size:0.95rem;">카메라와 모델을 불러오는 중...</span>
      </div>
      <div class="status-bar">
        <div>
          <span class="dot" id="status-dot"></span>
          <span id="status-text">초기화 중</span>
        </div>
        <span id="streak-text">연속 감지: 0 / 6</span>
      </div>
    </section>

    <section class="info-panel">
      <div class="greeting-box" id="greeting-box">
        <span class="badge" id="state-badge">대기 중</span>
        <div class="greeting-title" id="greeting-title">사람을 인식하는 중입니다</div>
        <div class="greeting-sub" id="greeting-sub">배경 상태에서는 인사말이 출력되지 않습니다.</div>
      </div>

      <div class="bars">
        <div class="bars-heading">실시간 레이블 확률</div>

        <div class="bar-item">
          <div class="bar-label-row">
            <span>나</span>
            <span id="prob-나">0.0%</span>
          </div>
          <div class="bar-track">
            <div class="bar-fill" id="bar-나" data-label="나"></div>
          </div>
        </div>

        <div class="bar-item">
          <div class="bar-label-row">
            <span>이주형</span>
            <span id="prob-이주형">0.0%</span>
          </div>
          <div class="bar-track">
            <div class="bar-fill" id="bar-이주형" data-label="이주형"></div>
          </div>
        </div>

        <div class="bar-item">
          <div class="bar-label-row">
            <span>배경</span>
            <span id="prob-배경">0.0%</span>
          </div>
          <div class="bar-track">
            <div class="bar-fill" id="bar-배경" data-label="배경"></div>
          </div>
        </div>
      </div>

      <p class="debounce-hint">
        확신도 75% 이상이 6프레임 연속 감지될 때 상태가 확정되며, 확정된 상태가 바뀔 때만 음성이 1회 재생됩니다.
      </p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
  <script>
    // 필요 시 모델 URL을 변경하세요.
    const MODEL_URL = "https://teachablemachine.withgoogle.com/models/zvX7ZSzKyD/";

    // 흔들림 방지 설정: 확신도 임계값 및 연속 프레임 수
    const CONFIDENCE_THRESHOLD = 0.75;
    const REQUIRED_CONSECUTIVE_FRAMES = 6;

    const LABELS = ["나", "이주형", "배경"];

    let model = null;
    let webcam = null;
    let candidateLabel = null;
    let consecutiveCount = 0;
    let confirmedState = null; // "나" | "이주형" | "배경" | null

    const statusDot = document.getElementById("status-dot");
    const statusText = document.getElementById("status-text");
    const streakText = document.getElementById("streak-text");
    const greetingBox = document.getElementById("greeting-box");
    const stateBadge = document.getElementById("state-badge");
    const greetingTitle = document.getElementById("greeting-title");
    const greetingSub = document.getElementById("greeting-sub");
    const loadingText = document.getElementById("loading-text");

    function speakKorean(text) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "ko-KR";
      utterance.rate = 1.0;
      utterance.pitch = 1.0;

      const voices = window.speechSynthesis.getVoices();
      const koVoice = voices.find((v) => v.lang && v.lang.toLowerCase().startsWith("ko"));
      if (koVoice) {
        utterance.voice = koVoice;
      }
      window.speechSynthesis.speak(utterance);
    }

    function applyConfirmedState(nextState) {
      const isStateChanged = nextState !== confirmedState;
      confirmedState = nextState;

      greetingBox.classList.remove("state-me", "state-lee");

      if (nextState === "나") {
        greetingBox.classList.add("state-me");
        stateBadge.textContent = "인식됨 · 나";
        greetingTitle.textContent = "환영합니다! 오늘도 좋은 하루 되세요.";
        greetingSub.textContent = "상태 확정: 나";
        if (isStateChanged) {
          speakKorean("환영합니다! 오늘도 좋은 하루 되세요.");
        }
      } else if (nextState === "이주형") {
        greetingBox.classList.add("state-lee");
        stateBadge.textContent = "인식됨 · 이주형";
        greetingTitle.textContent = "안녕하세요? 용건을 말해주세요";
        greetingSub.textContent = "상태 확정: 이주형";
        if (isStateChanged) {
          speakKorean("안녕하세요? 용건을 말해주세요");
        }
      } else {
        // "배경": 사람이 없는 상태로 처리하며 인사말 출력 안 함
        stateBadge.textContent = "사람 없음 · 배경";
        greetingTitle.textContent = "현재 사람이 감지되지 않았습니다";
        greetingSub.textContent = "배경 상태에서는 인사말이 출력되지 않습니다.";
      }
    }

    function updateProbabilityBars(predictions) {
      const probMap = { "나": 0, "이주형": 0, "배경": 0 };
      for (const item of predictions) {
        if (LABELS.includes(item.className)) {
          probMap[item.className] = item.probability;
        }
      }

      for (const label of LABELS) {
        const pct = (probMap[label] * 100).toFixed(1);
        const barEl = document.getElementById(`bar-${label}`);
        const probEl = document.getElementById(`prob-${label}`);
        if (barEl) barEl.style.width = `${pct}%`;
        if (probEl) probEl.textContent = `${pct}%`;
      }

      return probMap;
    }

    function processStability(probMap) {
      let topLabel = null;
      let topProb = 0;

      for (const label of LABELS) {
        if (probMap[label] > topProb) {
          topProb = probMap[label];
          topLabel = label;
        }
      }

      if (topLabel && topProb >= CONFIDENCE_THRESHOLD) {
        if (topLabel === candidateLabel) {
          consecutiveCount += 1;
        } else {
          candidateLabel = topLabel;
          consecutiveCount = 1;
        }
      } else {
        candidateLabel = null;
        consecutiveCount = 0;
      }

      streakText.textContent = `연속 감지: ${consecutiveCount} / ${REQUIRED_CONSECUTIVE_FRAMES}`;

      if (candidateLabel && consecutiveCount >= REQUIRED_CONSECUTIVE_FRAMES) {
        applyConfirmedState(candidateLabel);
      }
    }

    async function loop() {
      if (webcam && model) {
        webcam.update();
        const predictions = await model.predict(webcam.canvas);
        const probMap = updateProbabilityBars(predictions);
        processStability(probMap);
      }
      window.requestAnimationFrame(loop);
    }

    async function init() {
      try {
        const baseUrl = MODEL_URL.endsWith("/") ? MODEL_URL : `${MODEL_URL}/`;
        const modelURL = `${baseUrl}model.json`;
        const metadataURL = `${baseUrl}metadata.json`;

        model = await tmImage.load(modelURL, metadataURL);

        const flip = true; // 전면 카메라 좌우 반전
        webcam = new tmImage.Webcam(480, 360, flip);
        await webcam.setup();
        await webcam.play();

        const container = document.getElementById("webcam-container");
        if (loadingText) loadingText.remove();
        container.innerHTML = "";
        container.appendChild(webcam.canvas);

        if ("speechSynthesis" in window) {
          window.speechSynthesis.getVoices();
        }

        statusDot.classList.add("active");
        statusText.textContent = "실시간 인식 중";
        window.requestAnimationFrame(loop);
      } catch (err) {
        console.error(err);
        statusDot.classList.add("error");
        statusText.textContent = "초기화 실패";
        if (loadingText) {
          loadingText.textContent = "웹캠 또는 모델 로드에 실패했습니다. 카메라 권한과 HTTPS/localhost 환경을 확인하세요.";
        }
      }
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
