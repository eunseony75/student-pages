<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>쿠미귀신 손바닥 이펙트 - MediaPipe Tasks-Vision</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #07070b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      gap: 12px;
    }

    .hud {
      width: 100%;
      max-width: 840px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: rgba(18, 18, 26, 0.9);
      border: 1px solid #27273a;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.9rem;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.8rem;
      background: #27273a;
      color: #e4e4e7;
    }

    .badge.open {
      background: rgba(56, 189, 248, 0.2);
      color: #7dd3fc;
    }

    .badge.haunt {
      background: rgba(220, 38, 38, 0.28);
      color: #fca5a5;
    }

    .stage {
      position: relative;
      width: 100%;
      max-width: 840px;
      aspect-ratio: 4 / 3;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #27273a;
      background: #000;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
    }

    video {
      display: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .guide {
      width: 100%;
      max-width: 840px;
      color: #a1a1aa;
      font-size: 0.82rem;
      text-align: center;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>
      <span id="status-text">카메라 및 HandLandmarker 초기화 중...</span>
    </div>
    <div style="display:flex; gap:8px; align-items:center;">
      <span class="badge" id="hand-state-badge">손 상태: 미감지</span>
      <span class="badge" id="spread-value">펴짐 지수: -</span>
    </div>
  </div>

  <div class="stage">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output-canvas"></canvas>
  </div>

  <p class="guide">
    1) 전면 카메라에 손을 비추고 <strong>손바닥을 완전히 활짝 펴세요</strong>.  | 
    2) 편 상태에서 <strong>손을 다시 오므리면</strong> 손바닥에 쿠미귀신이 나타납니다.
  </p>

  <script type="module">
    import {
      FilesetResolver,
      HandLandmarker
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const videoEl = document.getElementById("webcam");
    const canvasEl = document.getElementById("output-canvas");
    const ctx = canvasEl.getContext("2d");

    const statusText = document.getElementById("status-text");
    const handStateBadge = document.getElementById("hand-state-badge");
    const spreadValueEl = document.getElementById("spread-value");

    let handLandmarker = null;
    let lastVideoTime = -1;
    let animFrameId = null;

    // 손 펴짐 -> 오므림 상태 머신 변수
    let handPosture = "UNKNOWN"; // "OPEN" | "CLOSED" | "UNKNOWN"
    let wasFullyOpen = false;
    let openStreak = 0;
    let closedStreak = 0;
    let lastTriggerTime = 0;

    // 쿠미귀신 이펙트 상태
    let hauntEffect = null;

    const OPEN_THRESHOLD = 1.62;       // 손가락 끝 평균 거리 / 손목-중지MCP 길이 비율 (편 상태)
    const CLOSED_THRESHOLD = 1.18;     // 오므린 상태 기준
    const STREAK_REQUIRED = 3;         // 프레임
