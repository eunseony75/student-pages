<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>실시간 얼굴 인식 인사말</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #0b1120;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --me: #22c55e;
      --friend: #f59e0b;
      --bg-state: #64748b;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
      background: radial-gradient(circle at top, #172554 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 920px;
      background: rgba(30, 41, 59, 0.92);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 26px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .pill {
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
    }

    .pill.me {
      background: rgba(34, 197, 94, 0.16);
      color: #4ade80;
      border-color: rgba(34, 197, 94, 0.4);
    }

    .pill.friend {
      background: rgba(245, 158, 11, 0.16);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.4);
    }

    .pill.bg-state {
      background: rgba(100, 116, 139, 0.22);
      color: #cbd5e1;
      border-color: rgba(148, 163, 184, 0.35);
    }

    .greeting-banner {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 22px;
      text-align: center;
      margin-bottom: 22px;
      min-height: 92px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .greeting-main {
      font-size: 1.45rem;
      font-weight: 700;
      line-height: 1.35;
    }

    .greeting-sub {
      font-size: 0.86rem;
      color: var(--muted);
    }

    .content-grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 780px) {
      .content-grid {
        grid-template-columns: 1fr;
      }
    }

    .camera-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    #webcam-container {
      width: 360px;
      max-width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      overflow: hidden;
      background: #020617;
      border: 2px solid var(--border);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #webcam-container canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
      display: block;
    }

    .camera-meta {
      width: 100%;
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .btn {
      width: 100%;
      margin-top: 4px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #334155;
      color: var(--text);
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn:hover {
      background: #475569;
    }

    .bars-card {
      background: rgba(11, 17, 32, 0.72);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
    }

    .bars-card h2 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .bar-row {
      margin-bottom: 14px;
    }

    .bar-row:last-of-type {
      margin-bottom: 0;
    }

    .bar-label-line {
      display: flex;
      justify-content: space-between;
      font-size: 0.92rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .track {
      width: 100%;
      height: 15px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 999px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), #22c55e);
      transition: width 0.08s linear;
    }

    .rules-note {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.55;
    }

    .error-text {
      color: #f87171;
      font-size: 0.88rem;
      padding: 14px;
      text-align: center;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top-bar">
      <h1>실시간 얼굴 인식 인사말</h1>
      <div id="state-pill" class="pill">초기화 중...</div>
    </div>

    <div class="greeting-banner">
      <div id="greeting-main" class="greeting-main">웹캠과 모델을 불러오는 중입니다...</div>
      <div id="greeting-sub" class="greeting-sub">잠시만 기다려 주세요.</div>
    </div>

    <div class="content-grid">
      <div class="camera-box">
        <div id="webcam-container"></div>
        <div class="camera-meta">
          <span id="streak-text">연속 감지: 0 / 6 프레임</span>
          <span>확신도 기준: 75%</span>
        </div>
        <button id="voice-test-btn" class="btn" type="button">
          한국어 음성 출력 확인(브라우저 자동재생 차단 시 클릭)
        </button>
      </div>

      <div class="bars-card">
        <h2>레이블별 인식 확률</h2>
        <div id="bars-container"></div>
        <div class="rules-note">
          • 확신도 75% 이상이 6프레임 연속 감지되면 상태를 확정합니다.<br />
          • 확정 상태가 직전 상태와 바뀔 때만 한국어 음성을 1회 출력합니다.<br />
          • [배경] 상태에서는 사람이 없는 것으로 처리하며 인사말을 출력하지 않습니다.
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
  <script>
    const MODEL_URL = "https://teachablemachine.withgoogle.com/models/ZH3mhllcNp/";

    // 프레임 흔들림 방지 설정
    const CONFIDENCE_THRESHOLD = 0.75;
    const REQUIRED_CONSECUTIVE_FRAMES = 6;

    const MESSAGES = {
      ME: "어서 오세요! 오늘도 반갑습니다.",
      FRIEND: "안녕하세요? 용건을 말해주세요",
      BACKGROUND: ""
    };

    let model = null;
    let webcam = null;

    let pendingCategory = null;    // 연속 카운트 중인 후보 상태 ("ME" | "FRIEND" | "BACKGROUND" | null)
    let streakCount = 0;           // 후보 상태 연속 프레임 수
    let activeCategory = null;     // 현재 확정된 상태
    let lastSpokenCategory = null; // 마지막으로 음성 안내를 실행한 상태

    const statePill = document.getElementById("state-pill");
    const greetingMain = document.getElementById("greeting-main");
    const greetingSub = document.getElementById("greeting-sub");
    const barsContainer = document.getElementById("bars-container");
    const streakText = document.getElementById("streak-text");
    const webcamContainer = document.getElementById("webcam-container");
    const voiceTestBtn = document.getElementById("voice-test-btn");

    function normalizeCategory(rawLabel) {
      const normalized = String(rawLabel || "").replace(/[\[\]\s]/g, "").toLowerCase();
      if (normalized === "나" || normalized === "me") return "ME";
      if (normalized === "친구" || normalized === "friend") return "FRIEND";
      if (normalized === "배경" || normalized === "background") return "BACKGROUND";
      return normalized.toUpperCase();
    }

    function labelTitle(category) {
      if (category === "ME") return "[나]";
      if (category === "FRIEND") return "[친구]";
      if (category === "BACKGROUND") return "[배경]";
      return "대기 중";
    }

    function speakKorean(text) {
      if (!("speechSynthesis" in window) || !text) return;
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "ko-KR";
        utter.rate = 1.0;
        utter.pitch = 1.0;

        const koVoice = window.speechSynthesis
          .getVoices()
          .find((v) => v.lang && v.lang.toLowerCase().startsWith("ko"));
        if (koVoice) {
          utter.voice = koVoice;
        }

        window.speechSynthesis.speak(utter);
      } catch (e) {
        console.warn("TTS 실행 중 오류:", e);
      }
    }

    function commitState(nextCategory) {
      activeCategory = nextCategory;

      statePill.className = "pill";
      if (nextCategory === "ME") {
        statePill.classList.add("me");
        statePill.textContent = "확정 상태: [나]";
        greetingMain.textContent = MESSAGES.ME;
        greetingSub.textContent = "환영 인사가 표시되었습니다.";
      } else if (nextCategory === "FRIEND") {
        statePill.classList.add("friend");
        statePill.textContent = "확정 상태: [친구]";
        greetingMain.textContent = MESSAGES.FRIEND;
