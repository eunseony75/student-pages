<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediaPipe 손 인식 주황색 에너지 구체 & 레이저 빔</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #07090f;
      color: #f3f6ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    video {
      display: none;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #hud {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 10;
      background: rgba(12, 16, 28, 0.72);
      border: 1px solid rgba(255, 165, 60, 0.28);
      backdrop-filter: blur(10px);
      border-radius: 14px;
      padding: 14px 18px;
      max-width: 390px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }
    #hud h1 {
      font-size: 15px;
      font-weight: 700;
      color: #ffae42;
      margin-bottom: 6px;
    }
    #status-text {
      font-size: 13px;
      line-height: 1.45;
      color: #e6ecff;
      margin-bottom: 8px;
    }
    .guide {
      font-size: 12px;
      color: #9aa7c7;
      line-height: 1.45;
    }
    .badge {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(255, 136, 0, 0.18);
      color: #ffc270;
      border: 1px solid rgba(255, 150, 40, 0.4);
    }
  </style>
</head>
<body>
  <div id="stage">
    <video id="webcam" playsinline autoplay muted></video>
    <canvas id="output-canvas"></canvas>
  </div>

  <div id="hud">
    <h1>HAND ENERGY &amp; LASER SYSTEM</h1>
    <div id="status-text">카메라 및 MediaPipe HandLandmarker 초기화 중...</div>
    <div class="guide">
      1. 손을 <b>완전히 펼쳐</b> 보자기 상태 만들기<br />
      2. 손을 <b>오므리면</b> 손바닥에 주황색 에너지 구체 충전<br />
      3. 다시 <b>완전히 펴면</b> 전방으로 굵은 레이저 빔 발사
    </div>
    <div id="state-badge" class="badge">STATE: IDLE</div>
  </div>

  <script type="module">
    import {
      HandLandmarker,
      FilesetResolver,
      DrawingUtils
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const videoEl = document.getElementById("webcam");
    const canvasEl = document.getElementById("output-canvas");
    const ctx = canvasEl.getContext("2d");
    const statusText = document.getElementById("status-text");
    const stateBadge = document.getElementById("state-badge");

    const drawingUtils = new DrawingUtils(ctx);

    // 제스처 상태 머신:
    // IDLE -> ARMED_OPEN (완전히 편 상태) -> CHARGING (오므리며 충전) -> FIRING (다시 펴서 레이저 발사)
    const STATE = {
      IDLE: "IDLE",
      ARMED_OPEN: "ARMED_OPEN",
      CHARGING: "CHARGING",
      FIRING: "FIRING"
    };

    let currentState = STATE.IDLE;
    let charge = 0; // 0.0 ~ 1.0
    let beamTimer = 0; // 발사 지속 시간(초)
    let beamIntensity = 0; // 0.0 ~ 1.0
    let screenShake = 0;

    // 손바닥 중심 스무딩 및 레이저 방향
    let palmPos = null;
    let aimDir = { x: 0, y: -1 };
    let lastTime = performance.now();
    let lastVideoTime = -1;
    let handLandmarker = null;

    // 충전 파티클 풀
    const particles = [];

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvasEl.width = Math.floor(window.innerWidth * dpr);
      canvasEl.height = Math.floor(window.innerHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function dist(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    // 손 크기(손목 ~ 중지 MCP) 대비 손가락 펴짐/오므림 정도 계산 (0 = 완전히 오므림, 1 = 완전히 펼침)
    function computeOpenness(landmarks) {
      const wrist = landmarks[0];
      const middleMcp = landmarks[9];
      const palmScale = Math.max(dist(wrist, middleMcp), 1e-4);

      const fingers = [
        { tip: 8, mcp: 5 },   // 검지
        { tip: 12, mcp: 9 },  // 중지
        { tip: 16, mcp: 13 }, // 약지
        { tip: 20, mcp: 17 }  // 새끼
      ];

      let sumRatio = 0;
      for (const f of fingers) {
        const tipDist = dist(wrist, landmarks[f.tip]);
        const mcpDist = dist(wrist, landmarks[f.mcp]);
        // 손이 펼쳐지면 tipDist가 mcpDist보다 훨씬 큼
        const raw = (tipDist - mcpDist * 0.75) / (palmScale * 1.15);
        sumRatio += Math.max(0, Math.min(1, raw));
      }

      // 엄지(tip 4, mcp 2)도 반영
      const thumbRaw = (dist(landmarks[17], landmarks[4]) - palmScale * 0.65) / (palmScale * 1.1);
      sumRatio += Math.max(0, Math.min(1, thumbRaw));

      return sumRatio / 5;
    }

    // 손바닥 중심 좌표(캔버스 픽셀 기준, 좌우 반전 반영)
    function getPalmCenter(landmarks, viewW, viewH) {
      const indices = [0, 1, 5, 9, 13, 17];
      let sx = 0;
      let sy = 0;
      for (const idx of indices) {
        sx += landmarks[idx].x;
        sy += landmarks[idx].y;
      }
      const nx = 1 - sx / indices.length; // 전면 카메라 미러링
      const ny = sy / indices.length;
      return {
        x: nx * viewW,
        y: ny * viewH
      };
    }

    // 손목 -> 중지 MCP 벡터로 전방 발사 방향 계산 (미러링 반영)
    function getForwardDirection(landmarks) {
      const wrist = landmarks[0];
      const middleMcp = landmarks[9];
      const dx = (1 - middleMcp.x) - (1 - wrist.x);
      const dy = middleMcp.y - wrist.y;
      const len = Math.hypot(dx, dy) || 1;
      return { x: dx / len, y: dy / len };
    }

    function spawnChargeParticles(centerX, centerY, currentCharge) {
      const count = Math.floor(2 + currentCharge * 5);
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const radius = 36 + Math.random() * 55 * (0.5 + currentCharge);
        particles.push({
          x: centerX + Math.cos(angle) * radius,
          y: centerY + Math.sin(angle) * radius,
          targetX: centerX,
          targetY: centerY,
          speed: 3.2 + currentCharge * 4.5,
          size: 2 + Math.random() * 3.5,
          alpha: 0.6 + Math.random() * 0.4,
          hueShift: Math.random() * 18
        });
      }
    }

    function updateAndDrawParticles(ctx, dt, centerX, centerY) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.targetX = centerX;
        p.targetY = centerY;

        const dx = p.targetX - p.x;
        const dy = p.targetY - p.y;
        const d = Math.hypot(dx, dy);

        if (d < 8) {
          particles.splice(i, 1);
          continue;
        }

        // 나선형으로 빨려 들어가듯 이동
        const nx = dx / d;
        const ny = dy / d;
        const tx = -ny;
        const ty = nx;

        p.x += (nx * p.speed + tx * 1.6) * dt * 60;
        p.y += (ny * p.speed + ty * 1.6) * dt * 60;

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = `hsl(${26 + p.hueShift}, 100%, 62%)`;
        ctx.shadowColor = "#ff7b00";
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function drawEnergyOrb(ctx, x, y, amount, timeSec) {
      if (amount <= 0.01) return;

      const maxRadius = 56;
      const radius = 8 + amount * maxRadius;
      const pulse = 1 + Math.sin(timeSec * 14) * 0.07 * amount;
      const r = radius * pulse;

      ctx.save();

      // 바깥 주황색 글로우
      const outerGrad = ctx.createRadialGradient(x, y, r * 0.1, x, y, r * 2.1);
      outerGrad.addColorStop(0, "rgba(255, 248, 210, 0.98)");
      outerGrad.addColorStop(0.28, "rgba(255, 166, 25, 0.9)");
      outerGrad.addColorStop(0.65, "rgba(255, 85, 0, 0.42)");
      outerGrad.addColorStop(1, "rgba(255, 60, 0, 0)");

      ctx.fillStyle = outerGrad;
      ctx.beginPath();
      ctx.arc(x, y, r * 2.1, 0, Math.PI * 2);
      ctx.fill();

      // 에너지 코어 구체
      const coreGrad = ctx.createRadialGradient(
        x - r * 0.25,
        y - r * 0.25,
        r * 0.05,
        x,
        y,
        r
      );
      coreGrad.addColorStop(0, "#ffffff");
      coreGrad.addColorStop(0.35, "#ffd066");
      coreGrad.addColorStop(0.75, "#ff7700");
      coreGrad.addColorStop(1, "#cc2900");

      ctx.fillStyle = coreGrad;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();

      // 회전하는 에너지 링
      ctx.strokeStyle = `rgba(255, 210, 110, ${0.4 + amount * 0.5})`;
      ctx.lineWidth = 2 + amount * 2.5;
      for (let i = 0; i < 2; i++) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(timeSec * (i === 0 ? 3.2 : -2.4) + i * 1.1);
        ctx.beginPath();
        ctx.ellipse(0, 0, r * 1.35, r * 0.45, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      // 충전 진행 게이지 링
      ctx.strokeStyle = "rgba(255, 235, 180, 0.85)";
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.arc(x, y, r + 10, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * amount);
      ctx.stroke();

      ctx.restore();
    }

    function drawLaserBeam(ctx, originX, originY, dir, intensity, timeSec, viewW, viewH) {
      if (intensity <= 0.01) return;

      const beamLength = Math.max(viewW, viewH) * 2.2;
      const endX = originX + dir.x * beamLength;
      const endY = originY + dir.y * beamLength;

      const flicker = 0.9 + Math.sin(timeSec * 48) * 0.1;
      const baseWidth = (34 + intensity * 54) * flicker;

      ctx.save();
      ctx.lineCap = "round";

      // 1. 넓은 주황색 외곽 글로우
      ctx.strokeStyle = `rgba(255, 85, 0, ${0.28 * intensity})`;
      ctx.lineWidth = baseWidth * 2.3;
      ctx.shadowColor = "#ff5500";
      ctx.shadowBlur = 45;
      ctx.beginPath();
      ctx.moveTo(originX, originY);
      ctx.lineTo(endX, endY);
      ctx.stroke();

      // 2. 굵은 주황색 메인 빔 몸체
      ctx.strokeStyle = `rgba(255, 145, 20, ${0.88 * intensity})`;
      ctx.lineWidth = baseWidth;
      ctx.shadowColor = "#ff9900";
      ctx.shadowBlur = 24;
      ctx.beginPath();
      ctx.moveTo(originX, originY);
      ctx.lineTo(endX, endY);
      ctx.stroke();

      // 3. 고열 백색-황금색 중심 코어
      ctx.strokeStyle = `rgba(255, 252, 232, ${0.98 * intensity})`;
      ctx.lineWidth = baseWidth * 0.42;
      ctx.shadowColor = "#ffffff";
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.moveTo(originX, originY);
      ctx.lineTo(endX, endY);
      ctx.stroke();

      // 4. 발사 원점(손바닥) 플래시
      const flashR = (38 + intensity * 42) * flicker;
      const flashGrad = ctx.createRadialGradient(
        originX,
        originY,
        2,
        originX,
        originY,
        flashR
      );
      flashGrad.addColorStop(0, "rgba(255, 255, 255, 1)");
      flashGrad.addColorStop(0.35, "rgba(255, 185, 50, 0.9)");
      flashGrad.addColorStop(0.75, "rgba(255, 90, 0, 0.45)");
      flashGrad.addColorStop(1, "rgba(255, 60, 0, 0)");

      ctx.fillStyle = flashGrad;
      ctx.beginPath();
      ctx.arc(originX, originY, flashR, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function updateStateMachine(dt, handDetected, openness, currentPalm, forwardDir) {
      if (handDetected && currentPalm) {
        if (!palmPos) {
          palmPos = { ...currentPalm };
        } else {
          const smooth = 1 - Math.exp(-dt * 18);
          palmPos.x += (currentPalm.x - palmPos.x) * smooth;
          palmPos.y += (currentPalm.y - palmPos.y) * smooth;
        }

        const dirSmooth = 1 - Math.exp(-dt * 14);
        aimDir.x += (forwardDir.x - aimDir.x) * dirSmooth;
        aimDir.y += (forwardDir.y - aimDir.y) * dirSmooth;
        const len = Math.hypot(aimDir.x, aimDir.y) || 1;
        aimDir.x /= len;
        aimDir.y /= len;
      }

      // 레이저 발사 중일 때
      if (currentState === STATE.FIRING) {
        beamTimer -= dt;
        beamIntensity = Math.max(0, Math.min(1, beamTimer / 0.35));
        screenShake = Math.max(screenShake, 7 * beamIntensity);

        if (beamTimer <= 0) {
          beamIntensity = 0;
          charge = 0;
          // 손이 이미 펼쳐져 있으면 다음 사이클을 위해 ARMED_OPEN으로 바로 전환
          currentState = handDetected && openness >= 0.72 ? STATE.ARMED_OPEN : STATE.IDLE;
        }
        return;
      }

      if (!handDetected) {
        if (currentState === STATE.CHARGING) {
          charge = Math.max(0, charge - dt * 0.6);
          if (charge <= 0) currentState = STATE.IDLE;
        } else {
          currentState = STATE.IDLE;
          charge = Math.max(0, charge - dt * 1.2);
        }
        return;
      }

      // 손이 인식된 경우 상태 전환
      const OPEN_THRESHOLD = 0.72;   // 완전히 편 상태(보자기)
      const CLOSED_THRESHOLD = 0.36; // 오므린 상태

      if (currentState === STATE.IDLE) {
        charge = Math.max(0, charge - dt * 1.0);
        if (openness >= OPEN_THRESHOLD) {
          currentState = STATE.ARMED_OPEN;
        }
      } else if (currentState === STATE.ARMED_OPEN) {
        // 편 상태에서 오므리기 시작하면 에너지 구체 충전 시작
        if (openness <= CLOSED_THRESHOLD) {
          currentState = STATE.CHARGING;
        }
      } else if (currentState === STATE.CHARGING) {
        // 오므린 정도가 강할수록 더 빠르게 충전
        const foldFactor = Math.max(0.35, 1 - openness);
        charge = Math.min(1, charge + dt * 1.15 * foldFactor);
        spawnChargeParticles(palmPos.x, palmPos.y, charge);

        // 충전이 어느 정도 된 상태에서 손을 다시 완전히 펴면(보자기) 전방 레이저 발사!
        if (openness >= OPEN_THRESHOLD && charge >= 0.25) {
          currentState = STATE.FIRING;
          beamTimer = 0.85;
          beamIntensity = 1;
          screenShake = 12;
        }
      }
    }

    function updateHud(handDetected, openness) {
      stateBadge.textContent = `STATE: ${currentState} | CHARGE: ${Math.round(charge * 100)}%`;

      if (!handDetected) {
        statusText.textContent = "전면 카메라에 손이 보이도록 들어주세요.";
        return;
      }

      const openPct = Math.round(openness * 100);
      if (currentState === STATE.IDLE) {
        statusText.textContent = `손 펴짐 ${openPct}% — 먼저 손을 완전히 펴주세요.`;
      } else if (currentState === STATE.ARMED_OPEN) {
        statusText.textContent = `보자기 준비 완료(펴짐 ${openPct}%)! 손을 오므려 에너지를 충전하세요.`;
      } else if (currentState === STATE.CHARGING) {
        statusText.textContent = `주황색 에너지 구체 충전 중 (${Math.round(charge * 100)}%) — 다시 펴면 레이저 발사!`;
      } else if (currentState === STATE.FIRING) {
        statusText.textContent = "전방 레이저 빔 발사 중!!";
      }
    }

    async function initCameraAndLandmarker() {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );

      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 1,
        minHandDetectionConfidence: 0.6,
        minHandPresenceConfidence: 0.6,
        minTrackingConfidence: 0.6
      });

      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user",
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });

      videoEl.srcObject = stream;
      await videoEl.play();
      statusText.textContent = "준비 완료! 손을 완전히 펴서 시작하세요.";
      requestAnimationFrame(renderLoop);
    }

    function renderLoop(now) {
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;
      const timeSec = now / 1000;

      const viewW = window.innerWidth;
      const viewH = window.innerHeight;

      let handDetected = false;
      let openness = 0;
      let currentPalm = null;
      let forwardDir = { x: 0, y: -1 };
      let landmarks = null;

      if (
        handLandmarker &&
        videoEl.readyState >= 2 &&
        videoEl.currentTime !== lastVideoTime
      ) {
        lastVideoTime = videoEl.currentTime;
        const results = handLandmarker.detectForVideo(videoEl, now);
        if (results.landmarks && results.landmarks.length > 0) {
          handDetected = true;
          landmarks = results.landmarks[0];
          openness = computeOpenness(landmarks);
          currentPalm = getPalmCenter(landmarks, viewW, viewH);
          forwardDir = getForwardDirection(landmarks);
        }
      }

      updateStateMachine(dt, handDetected, openness, currentPalm, forwardDir);
      updateHud(handDetected, openness);

      // 화면 흔들림 감쇠
      screenShake = Math.max(0, screenShake - dt * 28);
      const shakeX = (Math.random() - 0.5) * 2 * screenShake;
      const shakeY = (Math.random() - 0.5) * 2 * screenShake;

      ctx.save();
      ctx.clearRect(0, 0, viewW, viewH);
      ctx.translate(shakeX, shakeY);

      // 전면 카메라 영상 좌우 반전 렌더링(비율 유지 커버)
      if (videoEl.readyState >= 2 && videoEl.videoWidth > 0) {
        const vidRatio = videoEl.videoWidth / videoEl.videoHeight;
        const viewRatio = viewW / viewH;
        let drawW, drawH, offsetX, offsetY;

        if (viewRatio > vidRatio) {
          drawW = viewW;
          drawH = viewW / vidRatio;
          offsetX = 0;
          offsetY = (viewH - drawH) / 2;
        } else {
          drawH = viewH;
          drawW = viewH * vidRatio;
          offsetX = (viewW - drawW) / 2;
          offsetY = 0;
        }

        ctx.save();
        ctx.translate(offsetX + drawW, offsetY);
        ctx.scale(-1, 1);
        ctx.drawImage(videoEl, 0, 0, drawW, drawH);
        ctx.restore();

        // 레이저 발사 시 화면 전체에 주황빛 플래시 오버레이
        if (beamIntensity > 0) {
          ctx.fillStyle = `rgba(255, 110, 0, ${0.14 * beamIntensity})`;
          ctx.fillRect(-20, -20, viewW + 40, viewH + 40);
        }

        // 손 랜드마크 가이드 라인 그리기 (미러링 좌표 적용)
        if (landmarks) {
          const mirroredLandmarks = landmarks.map((pt) => ({
            x: (1 - pt.x) * drawW + offsetX,
            y: pt.y * drawH + offsetY,
            z: pt.z
          }));
          drawingUtils.drawConnectors(
            mirroredLandmarks,
            HandLandmarker.HAND_CONNECTIONS,
            { color: "rgba(255, 190, 90, 0.55)", lineWidth: 2 }
          );
          drawingUtils.drawLandmarks(mirroredLandmarks, {
            color: "#ff9d2e",
            lineWidth: 1,
            radius: 3
          });
        }
      }

      // 충전 파티클 및 주황색 에너지 구체 렌더링
      if (palmPos) {
        updateAndDrawParticles(ctx, dt, palmPos.x, palmPos.y);
        if (currentState === STATE.CHARGING || charge > 0.01) {
          drawEnergyOrb(ctx, palmPos.x, palmPos.y, charge, timeSec);
        }
      }

      // 전방 굵은 레이저 빔 렌더링
      if (palmPos && beamIntensity > 0.01) {
        drawLaserBeam(
          ctx,
          palmPos.x,
          palmPos.y,
          aimDir,
          beamIntensity,
          timeSec,
          viewW,
          viewH
        );
      }

      ctx.restore();
      requestAnimationFrame(renderLoop);
    }

    initCameraAndLandmarker().catch((err) => {
      console.error(err);
      statusText.textContent =
        "초기화 실패: HTTPS 또는 localhost 환경인지, 카메라 권한이 허용되었는지 확인해 주세요.";
    });
  </script>
</body>
</html>
