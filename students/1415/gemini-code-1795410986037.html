<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>실시간 얼굴 인식 인사말 웹앱</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --success: #22c55e;
      --warn: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .app {
      width: 100%;
      max-width: 900px;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: #0f172a;
      border: 1px solid var(--card-border);
      font-size: 0.875rem;
      color: var(--muted);
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--warn);
    }

    .dot.active {
      background: var(--success);
      box-shadow: 0 0 10px var(--success);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 720px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .camera-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    #webcam-container {
      width: 100%;
      max-width: 360px;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      overflow: hidden;
      background: #0f172a;
      border: 2px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #webcam-container canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
      display: block;
    }

    .hint {
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.4;
    }

    .panel {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .greeting-card {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      min-height: 132px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
    }

    .state-tag {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.02em;
    }

    .greeting-text {
      font-size: 1.45rem;
      font-weight: 700;
      line-height: 1.35;
    }

    .sub-text {
      font-size: 0.875rem;
      color: var(--muted);
    }

    .bars {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .bars-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--muted);
    }

    .prob-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .prob-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.92rem;
      font-weight: 600;
    }

    .track {
      width: 100%;
      height: 12px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      transition: width 0.12s ease-out;
    }

    .prob-row.top .fill {
      background: linear-gradient(90deg, #16a34a, #4ade80);
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 0.82rem;
      color: var(--muted);
    }

    button {
      background: #334155;
      color: var(--text);
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.82rem;
      cursor: pointer;
    }

    button:hover {
      background: #475569;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>실시간 얼굴 인식 인사말</h1>
      <div class="status-pill">
        <span id="status-dot" class="dot"></span>
        <span id="status-text">모델 및 웹캠 초기화 중...</span>
      </div>
    </header>

    <div class="grid">
      <div class="camera-box">
        <div id="webcam-container"></div>
        <p class="hint">
          브라우저 자동재생 정책에 따라 첫 음성 출력이 막힐 경우 화면을 한 번 클릭해 주세요.
        </p>
      </div>

      <div class="panel">
        <div class="greeting-card">
          <div id="state-tag" class="state-tag">현재 확정 상태: 대기 중</div>
          <div id="greeting-text" class="greeting-text">인식을 기다리는 중입니다.</div>
          <div id="sub-text" class="sub-text">연속 프레임 안정화 후 상태가 전환됩니다.</div>
        </div>

        <div class="bars" id="bars-container">
          <div class="bars-title">레이블별 실시간 인식 확률</div>
        </div>

        <div class="controls">
          <span id="stability-info">확신도 기준: 80% 이상 · 연속 6프레임</span>
          <button id="test-voice-btn" type="button">음성 테스트</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
  <script>
    const MODEL_URL = "https://teachablemachine.withgoogle.com/models/XLD4neOoe/";

    // 안정화 파라미터: 일정 확신도 이상에서 N프레임 연속 감지 시 상태 확정
    const CONFIDENCE_THRESHOLD = 0.80;
    const REQUIRED_CONSECUTIVE_FRAMES = 6;

    // 레이블별 인사말 설정
    const GREETINGS = {
      "나": "환영합니다! 오늘도 좋은 하루 보내세요.",
      "안녕하세요": "안녕하세요? 용건을 말해주세요",
      "배경": ""
    };

    const LABELS_ORDER = ["나", "안녕하세요", "배경"];

    let model = null;
    let webcam = null;
    let isRunning = false;

    // 상태 추적 변수
    let confirmedState = null;       // 현재 확정된 상태 ("나" | "안녕하세요" | "배경" | null)
    let candidateState = null;       // 연속 감지 중인 후보 상태
    let consecutiveCount = 0;      // 후보 상태 연속 프레임 수
    let lastSpokenState = null;      // 직전에 음성을 출력한 상태 (동일 상태 중복 발화 방지)

    const statusDot = document.getElementById("status-dot");
    const statusText = document.getElementById("status-text");
    const stateTag = document.getElementById("state-tag");
    const greetingText = document.getElementById("greeting-text");
    const subText = document.getElementById("sub-text");
    const barsContainer = document.getElementById("bars-container");
    const testVoiceBtn = document.getElementById("test-voice-btn");

    const barElements = {};

    function initProbabilityBars() {
      LABELS_ORDER.forEach((label) => {
        const row = document.createElement("div");
        row.className = "prob-row";
        row.innerHTML = `
          <div class="prob-header">
            <span>[${label}]</span>
            <span class="pct">0.0%</span>
          </div>
          <div class="track">
            <div class="fill"></div>
          </div>
        `;
        barsContainer.appendChild(row);
        barElements[label] = {
          row,
          pct: row.querySelector(".pct"),
          fill: row.querySelector(".fill")
        };
      });
    }

    function updateProbabilityBars(predictions, topLabel) {
      const map = {};
      predictions.forEach((p) => {
        map[p.className] = p.probability;
      });

      LABELS_ORDER.forEach((label) => {
        const prob = map[label] ?? 0;
        const percent = (prob * 100).toFixed(1);
        const el = barElements[label];
        if (!el) return;

        el.pct.textContent = `${percent}%`;
        el.fill.style.width = `${Math.min(100, Math.max(0, prob * 100))}%`;
        el.row.classList.toggle("top", label === topLabel && prob >= CONFIDENCE_THRESHOLD);
      });
    }

    function speakKorean(text) {
      if (!("speechSynthesis" in window) || !text) return;

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "ko-KR";
      utterance.rate = 1.0;
      utterance.pitch = 1.0;

      const voices = window.speechSynthesis.getVoices();
      const koVoice = voices.find((v) => v.lang && v.lang.toLowerCase().startsWith("ko"));
      if (koVoice) {
        utterance.voice = koVoice;
      }

      window.speechSynthesis.speak(utterance);
    }

    function applyConfirmedState(newState) {
      const previousState = confirmedState;
      confirmedState = newState;

      if (newState === "나") {
        const msg = GREETINGS["나"];
        stateTag.textContent = "현재 확정 상태: [나]";
        greetingText.textContent = msg;
        subText.textContent = "환영 인사가 표시되었습니다.";

        if (previousState !== "나" && lastSpokenState !== "나") {
          speakKorean(msg);
          lastSpokenState = "나";
        }
      } else if (newState === "안녕하세요") {
        const msg = GREETINGS["안녕하세요"];
        stateTag.textContent = "현재 확정 상태: [안녕하세요]";
        greetingText.textContent = msg;
        subText.textContent = "인사말이 표시되었습니다.";

        if (previousState !== "안녕하세요" && lastSpokenState !== "안녕하세요") {
          speakKorean(msg);
          lastSpokenState = "안녕하세요";
        }
      } else if (newState === "배경") {
        stateTag.textContent = "현재 확정 상태: [배경]";
        greetingText.textContent = "사람이 감지되지 않았습니다.";
        subText.textContent = "배경 상태에서는 인사말을 하지 않습니다.";

        // 배경으로 전환되면 이전 인사 발화 기록 초기화 (다시 사람이 나타날 때 1회 말할 수 있도록)
        if (previousState !== "배경") {
          window.speechSynthesis?.cancel();
          lastSpokenState = "배경";
        }
      }
    }

    function processStability(predictions) {
      if (!predictions || predictions.length === 0) return;

      // 가장 높은 확률의 예측 찾기
      let best = predictions[0];
      for (let i = 1; i < predictions.length; i++) {
        if (predictions[i].probability > best.probability) {
          best = predictions[i];
        }
      }

      updateProbabilityBars(predictions, best.className);

      // 일정 확신도 이상일 때만 후보로 인정
      if (best.probability >= CONFIDENCE_THRESHOLD) {
        if (candidateState === best.className) {
          consecutiveCount += 1;
        } else {
          candidateState = best.className;
          consecutiveCount = 1;
        }

        if (consecutiveCount >= REQUIRED_CONSECUTIVE_FRAMES) {
          if (confirmedState !== candidateState) {
            applyConfirmedState(candidateState);
          }
        } else if (!confirmedState) {
          subText.textContent = `[${candidateState}] 감지 중... (${consecutiveCount}/${REQUIRED_CONSECUTIVE_FRAMES} 프레임)`;
        }
      } else {
        // 확신도 미달 시 후보 카운터 초기화 (흔들림 방지)
        candidateState = null;
        consecutiveCount = 0;
      }
    }

    async function loop() {
      if (!isRunning) return;
      webcam.update();
      const predictions = await model.predict(webcam.canvas);
      processStability(predictions);
      window.requestAnimationFrame(loop);
    }

    async function init() {
      initProbabilityBars();

      if ("speechSynthesis" in window) {
        window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => {
          window.speechSynthesis.getVoices();
        };
      }

      try {
        const modelURL = MODEL_URL + "model.json";
        const metadataURL = MODEL_URL + "metadata.json";

        model = await tmImage.load(modelURL, metadataURL);

        const flip = true;
        webcam = new tmImage.Webcam(360, 360, flip);
        await webcam.setup();
        await webcam.play();

        const container = document.getElementById("webcam-container");
        container.innerHTML = "";
        container.appendChild(webcam.canvas);

        statusDot.classList.add("active");
        statusText.textContent = "실시간 인식 중";
        isRunning = true;

        window.requestAnimationFrame(loop);
      } catch (err) {
        console.error(err);
        statusText.textContent = "초기화 실패 (카메라 권한 또는 네트워크 확인)";
        greetingText.textContent = "웹캠이나 모델을 불러올 수 없습니다.";
        subText.textContent = err.message || "브라우저 카메라 권한을 허용해 주세요.";
      }
    }

    testVoiceBtn.addEventListener("click", () => {
      speakKorean("한국어 음성 출력 테스트입니다.");
    });

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
