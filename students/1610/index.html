<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediaPipe 손 인식 머니 이펙트</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0d1117;
      color: #f0f6fc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .stage-wrapper {
      position: relative;
      width: min(92vw, 960px);
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      overflow: hidden;
      background: #161b22;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    /* 전면 카메라 거울 모드 */
    video, canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    video {
      opacity: 0.92;
    }

    canvas {
      pointer-events: none;
    }

    /* 상단 상태 HUD (거울 반전 방지 위해 캔버스 바깥에 배치) */
    .hud {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      z-index: 10;
      pointer-events: none;
    }

    .badge {
      background: rgba(13, 17, 23, 0.78);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 10px 14px;
      line-height: 1.45;
      font-size: 13px;
    }

    .status-title {
      font-weight: 700;
      font-size: 15px;
      color: #58a6ff;
    }

    .status-sub {
      color: #c9d1d9;
      margin-top: 2px;
    }

    .combo-box {
      text-align: right;
      background: rgba(13, 17, 23, 0.78);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 13px;
    }

    .combo-label {
      color: #8b949e;
      font-size: 11px;
    }

    .combo-value {
      font-weight: 700;
      font-size: 15px;
      color: #3fb950;
      margin-top: 2px;
    }

    .guide-bar {
      margin-top: 14px;
      width: min(92vw, 960px);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      font-size: 12.5px;
    }

    .guide-card {
      background: #161b22;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 10px 12px;
      color: #c9d1d9;
    }

    .guide-card strong {
      display: block;
      color: #f0f6fc;
      margin-bottom: 3px;
    }

    @media (max-width: 640px) {
      .guide-bar {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="stage-wrapper">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div class="hud">
      <div class="badge">
        <div id="stateText" class="status-title">카메라 및 모델 초기화 중...</div>
        <div id="detailText" class="status-sub">전면 카메라 접근을 허용해 주세요.</div>
      </div>
      <div class="combo-box">
        <div class="combo-label">시퀀스 상태</div>
        <div id="seqText" class="combo-value">대기 중</div>
      </div>
    </div>
  </div>

  <div class="guide-bar">
    <div class="guide-card">
      <strong>1. 편 손(보자기) → 지폐 쏟아짐</strong>
      손가락을 활짝 편 상태가 되면 손 위에서 지폐가 쏟아집니다.
    </div>
    <div class="guide-card">
      <strong>2. 손 모으기(주먹/모음) → 장전</strong>
      손을 모으면 돈다발이 장전됩니다.
    </div>
    <div class="guide-card">
      <strong>3. 다시 펴기 → 돈다발 쏟아짐 & 전방 발사</strong>
      모았다가 다시 펴면 돈다발이 쏟아지며 전방으로 발사됩니다!
    </div>
  </div>

  <script type="module">
    import {
      HandLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const video = document.getElementById("webcam");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const stateText = document.getElementById("stateText");
    const detailText = document.getElementById("detailText");
    const seqText = document.getElementById("seqText");

    let handLandmarker = null;
    let lastVideoTime = -1;
    let animationFrameId = null;

    // 손 상태 머신 변수
    // gesture: "UNKNOWN" | "OPEN" | "CLOSED"
    // phase: "IDLE" | "OPEN_POURING" | "GATHERED_CHARGED" | "BURST_FIRED"
    let currentGesture = "UNKNOWN";
    let sequencePhase = "IDLE";
    let openCooldown = 0;
    let fireCooldown = 0;

    // 파티클(지폐 & 돈다발) 배열
    const particles = [];

    // 손 연결선 인덱스 (MediaPipe 21 랜드마크)
    const HAND_CONNECTIONS = [
      [0, 1], [1, 2], [2, 3], [3, 4],       // 엄지
      [0, 5], [5, 6], [6, 7], [7, 8],       // 검지
      [5, 9], [9, 10], [10, 11], [11, 12],  // 중지
      [9, 13], [13, 14], [14, 15], [15, 16],// 약지
      [13, 17], [17, 18], [18, 19], [19, 20],// 소지
      [0, 17]                               // 손바닥 하단
    ];

    function dist(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    /**
     * 손가락 펴짐/모아짐 판별
     * 손목(0)에서 중지 MCP(9)까지의 거리를 기준 스케일로 사용해 카메라 거리 변화에 강건하게 판별
     */
    function classifyHand(landmarks) {
      const wrist = landmarks[0];
      const middleMcp = landmarks[9];
      const palmScale = Math.max(dist(wrist, middleMcp), 0.05);

      const tips = [8, 12, 16, 20];
      const pips = [6, 10, 14, 18];

      let extendedCount = 0;
      for (let i = 0; i < tips.length; i++) {
        const tipDist = dist(wrist, landmarks[tips[i]]);
        const pipDist = dist(wrist, landmarks[pips[i]]);
        if (tipDist > pipDist * 1.12 && tipDist > palmScale * 1.15) {
          extendedCount++;
        }
      }

      // 엄지 펴짐 여부 (검지 MCP 5번과의 거리로 판별)
      const thumbTipDist = dist(landmarks[4], landmarks[5]);
      if (thumbTipDist > palmScale * 0.62) {
        extendedCount++;
      }

      // 손끝들끼리의 평균 퍼짐 정도
      const spread =
        (dist(landmarks[8], landmarks[12]) +
         dist(landmarks[12], landmarks[16]) +
         dist(landmarks[16], landmarks[20])) / (3 * palmScale);

      if (extendedCount >= 4 && spread > 0.26) {
        return "OPEN";
      }
      if (extendedCount <= 1 && spread < 0.24) {
        return "CLOSED";
      }
      return "UNKNOWN";
    }

    /**
     * 지폐 또는 돈다발 파티클 생성
     * mode:
     *  - "bill": 낱장 지폐 쏟아짐
     *  - "bundle": 돈다발 쏟아짐
     *  - "launch": 전방 발사(비디오 좌표계 기준 -Y 방향이 화면 상단/전방)
     */
    function spawnMoney(x, y, mode, count = 1) {
      for (let i = 0; i < count; i++) {
        if (mode === "bill") {
          particles.push({
            type: "bill",
            x: x + (Math.random() - 0.5) * 140,
            y: y - 40 - Math.random() * 80,
            vx: (Math.random() - 0.5) * 3.5,
            vy: 1.5 + Math.random() * 3.0,
            angle: (Math.random() - 0.5) * Math.PI,
            vAngle: (Math.random() - 0.5) * 0.14,
            w: 44 + Math.random() * 12,
            h: 22 + Math.random() * 6,
            alpha: 1,
            gravity: 0.11,
            drag: 0.992,
            swayPhase: Math.random() * Math.PI * 2
          });
        } else if (mode === "bundle") {
          particles.push({
            type: "bundle",
            x: x + (Math.random() - 0.5) * 110,
            y: y - 60 - Math.random() * 70,
            vx: (Math.random() - 0.5) * 4.5,
            vy: 2.2 + Math.random() * 3.5,
            angle: (Math.random() - 0.5) * 0.7,
            vAngle: (Math.random() - 0.5) * 0.12,
            w: 62,
            h: 34,
            alpha: 1,
            gravity: 0.16,
            drag: 0.995,
            swayPhase: Math.random() * Math.PI * 2
          });
        } else if (mode === "launch") {
          // 손 중심에서 전방(화면 위쪽 -y 및 좌우 부채꼴)으로 강력하게 발사
          const spreadAngle = -Math.PI / 2 + (Math.random() - 0.5) * 0.85;
          const speed = 13 + Math.random() * 9;
          particles.push({
            type: Math.random() < 0.65 ? "bundle" : "bill",
            x: x + (Math.random() - 0.5) * 40,
            y: y - 10,
            vx: Math.cos(spreadAngle) * speed,
            vy: Math.sin(spreadAngle) * speed,
            angle: spreadAngle + Math.PI / 2,
            vAngle: (Math.random() - 0.5) * 0.25,
            w: 64,
            h: 35,
            alpha: 1,
            gravity: 0.22,
            drag: 0.985,
            swayPhase: Math.random() * Math.PI * 2
          });
        }
      }
    }

    function drawBill(p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);
      ctx.globalAlpha = Math.max(0, p.alpha);

      // 지폐 본체
      const grad = ctx.createLinearGradient(-p.w / 2, 0, p.w / 2, 0);
      grad.addColorStop(0, "#2ea043");
      grad.addColorStop(0.5, "#56d364");
      grad.addColorStop(1, "#238636");

      ctx.fillStyle = grad;
      ctx.strokeStyle = "#e6ffec";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(-p.w / 2, -p.h / 2, p.w, p.h, 3);
      ctx.fill();
      ctx.stroke();

      // 중앙 원형 문양
      ctx.strokeStyle = "rgba(255, 255, 255, 0.75)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(0, 0, Math.min(p.w, p.h) * 0.26, 0, Math.PI * 2);
      ctx.stroke();

      ctx.restore();
    }

    function drawBundle(p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);
      ctx.globalAlpha = Math.max(0, p.alpha);

      // 두툼한 돈다발 입체감(겹쳐진 층)
      for (let layer = 3; layer >= 0; layer--) {
        ctx.fillStyle = layer === 0 ? "#3fb950" : "#1f6feb";
        ctx.fillStyle = layer === 0 ? "#46d160" : (layer % 2 === 0 ? "#2ea043" : "#1b5e20");
        ctx.strokeStyle = "#d2fedb";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.roundRect(-p.w / 2 + layer * 1.5, -p.h / 2 - layer * 2.5, p.w, p.h, 4);
        ctx.fill();
        ctx.stroke();
      }

      // 돈다발을 묶는 띠지(빨간/금색 띠)
      ctx.fillStyle = "#f85149";
      ctx.fillRect(-7, -p.h / 2 - 7.5, 14, p.h + 7.5);
      ctx.strokeStyle = "#ffdcd7";
      ctx.lineWidth = 1;
      ctx.strokeRect(-7, -p.h / 2 - 7.5, 14, p.h + 7.5);

      ctx.restore();
    }

    function updateAndDrawParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.swayPhase += 0.08;
        p.vx = p.vx * p.drag + (p.type === "bill" ? Math.cos(p.swayPhase) * 0.08 : 0);
        p.vy = p.vy * p.drag + p.gravity;
        p.x += p.vx;
        p.y += p.vy;
        p.angle += p.vAngle;

        if (p.y > canvas.height + 80 || p.x < -120 || p.x > canvas.width + 120) {
          particles.splice(i, 1);
          continue;
        }

        if (p.type === "bill") {
          drawBill(p);
        } else {
          drawBundle(p);
        }
      }
    }

    function drawHandSkeleton(landmarks) {
      ctx.save();
      ctx.strokeStyle = "rgba(88, 166, 255, 0.85)";
      ctx.lineWidth = 2.5;

      for (const [startIdx, endIdx] of HAND_CONNECTIONS) {
        const a = landmarks[startIdx];
        const b = landmarks[endIdx];
        ctx.beginPath();
        ctx.moveTo(a.x * canvas.width, a.y * canvas.height);
        ctx.lineTo(b.x * canvas.width, b.y * canvas.height);
        ctx.stroke();
      }

      for (let i = 0; i < landmarks.length; i++) {
        const lm = landmarks[i];
        ctx.fillStyle = i === 0 ? "#f85149" : "#ffd33d";
        ctx.beginPath();
        ctx.arc(lm.x * canvas.width, lm.y * canvas.height, 4.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    /**
     * 제스처 전환 로직:
     * 1) 편 상태(OPEN) -> 지폐 쏟아짐
     * 2) 모은 상태(CLOSED) -> 돈다발 장전(GATHERED_CHARGED)
     * 3) 장전된 상태에서 다시 편 상태(OPEN) -> 돈다발 쏟아짐 + 전방 발사
     */
    function handleGestureTransition(gesture, palmX, palmY) {
      if (openCooldown > 0) openCooldown--;
      if (fireCooldown > 0) fireCooldown--;

      if (gesture === "OPEN") {
        // 손을 모았다가 다시 편 경우: 돈다발 쏟아짐 + 전방 발사!
        if (sequencePhase === "GATHERED_CHARGED" && fireCooldown === 0) {
          sequencePhase = "BURST_FIRED";
          fireCooldown = 25;
          spawnMoney(palmX, palmY, "bundle", 10);
          spawnMoney(palmX, palmY, "launch", 14);
          stateText.textContent = "돈다발 쏟아짐 & 전방 발사!";
          detailText.textContent = "손을 모았다가 다시 펴서 돈다발을 발사했습니다.";
          seqText.textContent = "전방 발사 완료 (다시 모아 장전 가능)";
          seqText.style.color = "#ff7b72";
        } else {
          // 완전히 편 상태에서 펴는 동작 -> 지폐 쏟아짐
          if (currentGesture !== "OPEN" && openCooldown === 0) {
            openCooldown = 12;
            spawnMoney(palmX, palmY, "bill", 9);
          }
          if (sequencePhase !== "BURST_FIRED") {
            sequencePhase = "OPEN_POURING";
            seqText.textContent = "1단계: 지폐 쏟아지는 중";
            seqText.style.color = "#56d364";
          }
          // 편 손 유지 시 지폐가 계속 쏟아지도록 보충
          if (Math.random() < 0.45) {
            spawnMoney(palmX, palmY, "bill", 2);
          }
          stateText.textContent = "손 펼침 감지 — 지폐 쏟아짐";
          detailText.textContent = "손을 모았다가 다시 펴면 돈다발이 쏟아지며 전방 발사됩니다.";
        }
      } else if (gesture === "CLOSED") {
        sequencePhase = "GATHERED_CHARGED";
        stateText.textContent = "손 모음 감지 — 돈다발 장전됨!";
        detailText.textContent = "이제 손을 다시 펴면 돈다발이 쏟아지며 전방으로 발사됩니다.";
        seqText.textContent = "2단계: 돈다발 장전 완료";
        seqText.style.color = "#ffd33d";
      } else {
        stateText.textContent = "손 인식 중";
        detailText.textContent = "손가락을 활짝 펴거나 모아보세요.";
      }

      if (gesture !== "UNKNOWN") {
        currentGesture = gesture;
      }
    }

    async function initMediaPipe() {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );

      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 2,
        minHandDetectionConfidence: 0.6,
        minHandPresenceConfidence: 0.6,
        minTrackingConfidence: 0.6
      });
    }

    async function initCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user",
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });

      video.srcObject = stream;
      await new Promise((resolve) => {
        video.onloadedmetadata = () => {
          canvas.width = video.videoWidth || 1280;
          canvas.height = video.videoHeight || 720;
          resolve();
        };
      });
      await video.play();
    }

    function renderLoop() {
      if (video.readyState >= 2 && handLandmarker && video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const results = handLandmarker.detectForVideo(video, performance.now());

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (results.landmarks && results.landmarks.length > 0) {
          for (const landmarks of results.landmarks) {
            drawHandSkeleton(landmarks);
            const palm = landmarks[9];
            const palmX = palm.x * canvas.width;
            const palmY = palm.y * canvas.height;
            const gesture = classifyHand(landmarks);
            handleGestureTransition(gesture, palmX, palmY);
          }
        } else {
          stateText.textContent = "손을 카메라 앞에 보여주세요";
          detailText.textContent = "전면 카메라에 손 전체가 나오도록 위치시켜 주세요.";
        }

        updateAndDrawParticles();
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        updateAndDrawParticles();
      }

      animationFrameId = requestAnimationFrame(renderLoop);
    }

    async function bootstrap() {
      try {
        await initCamera();
        await initMediaPipe();
        stateText.textContent = "준비 완료 — 손을 펴거나 모아보세요";
        detailText.textContent = "편 상태 → 지폐 쏟아짐 / 모았다가 다시 펴기 → 돈다발 쏟아짐 & 전방 발사";
        renderLoop();
      } catch (err) {
        console.error(err);
        stateText.textContent = "초기화 오류";
        detailText.textContent =
          err.name === "NotAllowedError"
            ? "카메라 권한이 거부되었습니다. 브라우저 설정에서 카메라를 허용해 주세요."
            : "카메라 또는 MediaPipe 모델을 불러오는 중 문제가 발생했습니다.";
      }
    }

    bootstrap();

    window.addEventListener("beforeunload", () => {
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      if (video.srcObject) {
        video.srcObject.getTracks().forEach((t) => t.stop());
      }
    });
  </script>
</body>
</html>
