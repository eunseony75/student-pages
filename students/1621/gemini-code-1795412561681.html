<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>네온 레이저 귀신 퇴치 웹앱 (MediaPipe)</title>
  <style>
    :root {
      --bg: #050811;
      --panel: rgba(11, 18, 34, 0.8);
      --border: rgba(56, 189, 248, 0.28);
      --text: #f8fafc;
      --muted: #94a3b8;
      --neon: #38bdf8;
      --neon-bright: #bae6fd;
      --ghost: #c084fc;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      overflow: hidden;
    }

    .app {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 30%, #121836 0%, var(--bg) 74%);
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 1280px;
      max-height: 820px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video#webcam {
      display: none;
    }

    canvas#fx-canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 16px;
      box-shadow: 0 0 55px rgba(56, 189, 248, 0.2);
    }

    .hud-top {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      pointer-events: none;
      flex-wrap: wrap;
    }

    .hud-card {
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 16px;
    }

    .hud-title {
      font-size: 0.96rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 10px #f59e0b;
    }

    .dot.ready {
      background: #38bdf8;
      box-shadow: 0 0 12px #38bdf8;
    }

    .dot.charging {
      background: #22d3ee;
      box-shadow: 0 0 16px #22d3ee;
    }

    .dot.firing {
      background: #ffffff;
      box-shadow: 0 0 22px #38bdf8;
    }

    .hud-sub {
      margin-top: 4px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .right-huds {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .stats-box {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat span {
      font-size: 0.72rem;
      color: var(--muted);
    }

    .stat strong {
      font-size: 1.08rem;
      font-variant-numeric: tabular-nums;
      color: var(--neon-bright);
    }

    .stat strong.ghost-stat {
      color: var(--ghost);
    }

    .charge-box {
      min-width: 195px;
    }

    .charge-head {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .charge-head strong {
      color: var(--neon-bright);
    }

    .charge-track {
      width: 100%;
      height: 9px;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .charge-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2563eb, #38bdf8, #bae6fd);
      box-shadow: 0 0 12px #38bdf8;
      transition: width 0.06s linear;
    }

    .hud-bottom {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 10px 20px;
      font-size: 0.88rem;
      color: var(--text);
      white-space: nowrap;
      pointer-events: none;
    }

    .hud-bottom span {
      color: var(--neon-bright);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="stage">
      <video id="webcam" playsinline muted></video>
      <canvas id="fx-canvas"></canvas>

      <div class="hud-top">
        <div class="hud-card">
          <div class="hud-title">
            <span id="status-dot" class="dot"></span>
            <span id="phase-label">전면 카메라 및 HandLandmarker 로딩 중...</span>
          </div>
          <div id="detail-label" class="hud-sub">손 펼침도: 0% · 레이저로 귀신을 정화하세요</div>
        </div>

        <div class="right-huds">
          <div class="hud-card stats-box">
            <div class="stat">
              <span>점수</span>
              <strong id="score-val">0</strong>
            </div>
            <div class="stat">
              <span>퇴치</span>
              <strong id="kills-val" class="ghost-stat">0</strong>
            </div>
            <div class="stat">
              <span>콤보</span>
              <strong id="combo-val">0x</strong>
            </div>
          </div>

          <div class="hud-card charge-box">
            <div class="charge-head">
              <span>네온 에너지 구체</span>
              <strong id="charge-val">0%</strong>
            </div>
            <div class="charge-track">
              <div id="charge-fill" class="charge-fill"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="guide-pill" class="hud-bottom">
        <span>1단계</span> 손 펴기 → <span>2단계</span> 오므려 파란 구체 충전 → <span>3단계</span> 다시 펴서 레이저로 귀신 격파!
      </div>
    </div>
  </div>

  <script type="module">
    import {
      FilesetResolver,
      HandLandmarker
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

    const videoEl = document.getElementById("webcam");
    const canvasEl = document.getElementById("fx-canvas");
    const ctx = canvasEl.getContext("2d");

    const statusDotEl = document.getElementById("status-dot");
    const phaseLabelEl = document.getElementById("phase-label");
    const detailLabelEl = document.getElementById("detail-label");
    const scoreValEl = document.getElementById("score-val");
    const killsValEl = document.getElementById("kills-val");
    const comboValEl = document.getElementById("combo-val");
    const chargeValEl = document.getElementById("charge-val");
    const chargeFillEl = document.getElementById("charge-fill");
    const guidePillEl = document.getElementById("guide-pill");

    const OPEN_THRESHOLD = 0.64;
    const CLOSED_THRESHOLD = 0.36;
    const MIN_CHARGE_TO_FIRE = 0.25;
    const BEAM_DURATION_MS = 680;
    const MAX_GHOSTS = 7;

    // 상태 머신: IDLE -> ARMED_OPEN -> CHARGING -> FIRING
    let state = "IDLE";
    let charge = 0;
    let fireStartTime = 0;
    let beamOrigin = { x: 0, y: 0 };
    let beamDir = { x: 0, y: -1 };
    let beamEnd = { x: 0, y: -100 };
    let beamWidth = 48;
    let beamPower = 1;
    let hitGhostIdsThisShot = new Set();

    let score = 0;
    let kills = 0;
    let combo = 0;
    let last
